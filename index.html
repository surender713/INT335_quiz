<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>INT335 Midterm — Question Bank Practice (150)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2933;--mut:#617080;--line:#dde2e8;--acc:#2c3e50;--teal:#16a085;--ok:#1e8e5a;--okbg:#e6f5ed;--bad:#c0392b;--badbg:#fdecea;--amber:#f39c12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--acc);color:#fff;padding:18px 20px}
header h1{margin:0;font-size:1.25rem}header p{margin:4px 0 0;color:#c9d3dc;font-size:.9rem}
main{max-width:820px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.unit h2{margin:0 0 4px;font-size:1.05rem;color:var(--acc)}
.unit .meta{color:var(--mut);font-size:.85rem;margin-bottom:10px}
.topic{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.topic label{flex:1;cursor:pointer}.topic span.n{color:var(--mut);font-size:.85rem}
.allrow{font-weight:600}
button{font:inherit;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.primary{background:var(--teal);color:#fff;font-weight:600}.primary:disabled{background:#b7c4c0;cursor:not-allowed}
.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.opt-line{display:flex;gap:16px;margin:10px 0;color:var(--mut);font-size:.9rem;flex-wrap:wrap}
.bar{height:6px;background:#e5e9ee;border-radius:4px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--teal);width:0}
.tag{display:inline-block;font-size:.75rem;background:#eaf1f6;color:var(--acc);border-radius:20px;padding:2px 10px;margin-right:6px}
.case{background:#f2f6f9;border-left:4px solid var(--amber);padding:12px 14px;border-radius:6px;margin:12px 0}
.case b{display:block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:#a56a00;margin-bottom:4px}
.q{font-weight:600;margin:12px 0}
.o{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);margin:8px 0;padding:11px 14px;border-radius:10px}
.o:hover:not(:disabled){border-color:var(--teal)}
.o .l{font-weight:700;color:var(--mut);min-width:1.4em}
.o.ok{background:var(--okbg);border-color:var(--ok)}.o.bad{background:var(--badbg);border-color:var(--bad)}
.o:disabled{cursor:default;color:inherit}
.expl{margin-top:12px;padding:12px 14px;border-radius:8px;background:#f2f6f9;display:none}
.expl.show{display:block}.expl strong.r{color:var(--ok)}.expl strong.w{color:var(--bad)}
.score{font-size:2.4rem;font-weight:700;color:var(--acc)}
.hidden{display:none}
.sub textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.model{white-space:pre-wrap;margin-top:12px;padding:12px 14px;border-radius:8px;background:#eef7f3;border-left:4px solid var(--teal)}
.tag.t{background:#fff3d6;color:#8a5a00}
@media(max-width:520px){main{padding:14px 10px 50px}.card{padding:14px}}
</style></head><body>
<header><h1>INT335 Design Thinking — Midterm MCQ Practice</h1><p>MCQs (many case-based) + theory questions · Units 1–3</p></header>
<main>
<section id="menu">
 <div class="card"><div class="row"><button class="ghost" id="selAll">Select all topics</button><button class="ghost" id="selNone">Clear</button><span style="color:var(--mut)" id="selCount"></span></div>
 <div class="opt-line"><label><input type="checkbox" id="shuf" checked> Shuffle question order</label><label><input type="radio" name="qt" value="both" checked> MCQ + theory</label><label><input type="radio" name="qt" value="mcq"> MCQ only</label><label><input type="radio" name="qt" value="sub"> Theory only</label></div>
 <button class="primary" id="start" disabled>Start practice</button></div>
 <div id="units"></div>
</section>

 </div>

 <div class="row" style="justify-content:center"><button class="primary" id="again">Retry same set</button><button class="ghost" id="home">Back to menu</button></div>
</div></section>
</main>
<script>
const QS=[{"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "Meera, a third-year B.Tech student, spends three days on a circuit-design problem for her mini-project, trying every method she knows without success. A friend advises her to go for a long walk and stop thinking about it. The next morning, while brushing her teeth, a workable approach suddenly occurs to her.", "q": "Which explanation best fits what happened?", "opts": ["Diffuse mode works best on an empty mind, so her three days of effort were unnecessary.", "Her focused mode kept running unchanged during the walk and simply finished the calculation.", "Her diffuse mode reorganised material she had already struggled with in focused mode and produced a connection.", "The walk switched her learning style from Visual to Kinesthetic, which solved the problem."], "expl": "The diffuse mode does not work on an empty mind; it reorganises material you have already struggled with. Rule: struggle first (focused), then step away (diffuse).", "type": "mcq", "id": 1, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "Two students have ten days to solve an open design challenge. Arjun reads the brief once on Day 1 and then does nothing for nine days, saying his 'subconscious will work on it'. Neel works intensively for two days, then alternates between short breaks and further work.", "q": "Who is more likely to reach a creative breakthrough, and why?", "opts": ["Neither, because creative breakthroughs depend only on learning style and not on thinking modes.", "Both equally, because switching between modes is random and unrelated to study habits.", "Neel, because diffuse processing needs material previously wrestled with in focused mode, and effective problem-solving alternates the two modes.", "Arjun, because a longer rest gives the diffuse mode more time to build broad connections."], "expl": "Arjun gave the diffuse mode nothing to reorganise. Neel struggled first and then stepped away, which is exactly the alternation the notes recommend.", "type": "mcq", "id": 2, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "A team lead at a software firm must (i) trace a known bug line by line through an established debugging procedure, and (ii) later come up with an unconventional concept for a new feature.", "q": "Which thinking modes best suit tasks (i) and (ii)?", "opts": ["(i) Diffuse mode; (ii) Focused mode", "Both diffuse, because both tasks involve problem-solving", "(i) Focused mode; (ii) Diffuse mode", "Both focused, because engineering work is logical"], "expl": "Focused mode = concentrated attention using established pathways (procedures, code, analysis). Diffuse mode = relaxed, associative thinking that makes broader connections (brainstorming, innovative design).", "type": "mcq", "id": 3, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "", "q": "Which statement about the diffuse mode is correct?", "opts": ["It is the mode used for solving equations and writing code", "It follows established neural pathways to carry out procedures step by step", "It makes broader connections among ideas and is linked to brainstorming and innovative design", "It works best on a problem you have never thought about before"], "expl": "Diffuse mode = relaxed, associative thinking that makes broader connections. Focused mode handles equations, code, data and procedures.", "type": "mcq", "id": 4, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "A writer has spent hours drafting and is stuck on how to resolve her plot.", "q": "According to the course notes, what is the best next move?", "opts": ["Keep forcing focused effort without any break", "Take a break such as a walk so diffuse processing can work, then return", "Ask friends to judge every line immediately", "Delete the whole draft so the mind is empty"], "expl": "When stuck, take a break to allow diffuse processing. The most effective problem-solving alternates between focused and diffuse modes.", "type": "mcq", "id": 5, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "", "q": "Differentiate focused and diffuse thinking modes. Explain why effective problem-solving alternates between them.", "model": "Focused mode: concentrated attention on a specific task using established neural pathways; logical, structured, analytical, sequential. Examples: solving equations, writing code, following procedures.\nDiffuse mode: relaxed thinking that makes broader connections among ideas; creative, exploratory, flexible, associative. Examples: brainstorming, creative writing, innovative design.\nAlternation: when stuck, take a break (rest or a walk) to allow diffuse processing, then return to focus/study.\nCondition: the diffuse mode does not work on an empty mind; it reorganises material already struggled with. Struggle first, then step away.", "marks": 5, "type": "sub", "id": 6}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "A student starts a hard design assignment the night before the deadline and plans to 'sleep on it and let the subconscious solve it'.", "q": "Explain what is wrong with this plan using the focused/diffuse model, and advise a better schedule.", "model": "Wrong: the diffuse mode needs raw material from earlier focused effort; with no prior struggle there is nothing to reorganise, and too little time for alternation.\nBetter schedule: start early; work in focused mode on the problem (struggle first); step away (walk, rest, sleep); return to focus; repeat over several days.\nTrack where and when your best ideas arrive (Activity 1.1) to plan breaks.", "marks": 5, "type": "sub", "id": 7}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Learning Styles (VARK)", "case": "A college announces that after a VARK questionnaire every student will be taught only in their preferred style, claiming this 'guarantees higher marks'. A Design Thinking student is asked to comment.", "q": "Which critique is most consistent with the course notes?", "opts": ["The research is irrelevant because any idea that becomes popular must be evidence-backed.", "The claim is well supported by controlled studies, so the policy is correct.", "VARK is a useful prompt for self-reflection, but the claim that teaching in the preferred style improves results has repeatedly failed in controlled studies.", "VARK is useless even for reflection, so students should avoid thinking about how they study."], "expl": "Treat a VARK result as a nudge toward self-awareness, not a rule. The notes also stress that an idea can be hugely popular without research support, and that retrieval practice, spacing and interleaving are the strategies that do replicate.", "type": "mcq", "id": 8, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Learning Styles (VARK)", "case": "Using Activity 1.2 scoring (V = statements 1+5, A = 2+6, R = 3+7, K = 4+8), a student rates statements 1 to 8 as 2, 4, 5, 1, 3, 2, 4, 3 respectively.", "q": "Which VARK letter scores highest?", "opts": ["R (Reading/Writing)", "A (Auditory)", "V (Visual)", "K (Kinesthetic)"], "expl": "V = 2+3 = 5; A = 4+2 = 6; R = 5+4 = 9; K = 1+3 = 4. R is highest. (Remember this is a reflection prompt, not a rule for how you must study.)", "type": "mcq", "id": 9, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Learning Styles (VARK)", "case": "", "q": "In the VARK model, what does 'K' stand for and prefer?", "opts": ["Kinesthetic: practical, hands-on experience", "Key-learning: discussion and debate", "Kinetic: watching videos and animations", "Knowledge: textbooks and written notes"], "expl": "V = Visual, A = Auditory, R = Reading/Writing, K = Kinesthetic (practical, hands-on experience).", "type": "mcq", "id": 10, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Learning Styles (VARK)", "case": "", "q": "Explain the VARK model and critically evaluate the claim that teaching in a student's preferred style improves results.", "model": "VARK: Visual (diagrams, charts, videos), Auditory (listening, discussion), Reading/Writing (books, notes), Kinesthetic (hands-on practice).\nEvidence: VARK is a useful prompt for reflecting on how you study, but the stronger claim, that being taught in your preferred style improves results, has repeatedly failed to hold up in controlled studies.\nTreat the result as a nudge toward self-awareness, not a rule.\nStrategies that do replicate: retrieval practice, spacing and interleaving.\nDesign-thinking lesson: a popular idea may not be research-backed, and what people say they want is not always what works.", "marks": 5, "type": "sub", "id": 11}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "During a hackathon, a team needs a lightweight stand to hold a sensor above a table. Someone points at an empty cardboard tube from a kitchen roll and says, 'That's just rubbish.' Another member says, 'Hold on — it is hollow, light, rigid and cylindrical,' and uses it as the stand.", "q": "Which technique did the second member use to overcome functional fixedness?", "opts": ["Rejecting ideas early so the team could converge faster", "Listing the object's properties and finding a use for each, rather than thinking of its usual purpose", "Surveying users on how much they like cardboard tubes", "Following the team's conventional thinking in order to fit in"], "expl": "Functional fixedness is seeing objects only for their conventional purpose. The way out is to stop thinking about the object and start listing its properties, then find a use for each property.", "type": "mcq", "id": 12, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "A senior engineer with twenty years' experience is given a new thermal problem. Without studying how it differs from earlier ones, he proposes the same heat-sink-based solution he used in his last six projects.", "q": "Which cognitive block is most clearly at work?", "opts": ["Premature judgment", "Fear of failure", "Conformity", "The expertise trap"], "expl": "The expertise trap is over-reliance on past solutions: the more you know, the more you reach for what worked before.", "type": "mcq", "id": 13, "ans": 3}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "In a class brainstorm, Sana has an unusual idea but stays silent because a classmate laughed at her suggestion last week. Meanwhile the other five students keep repeating variations of the first idea that was spoken.", "q": "Which cognitive blocks are most evident for Sana and for the others, respectively?", "opts": ["Premature judgment; expertise trap", "Expertise trap; premature judgment", "Conformity; fear of failure", "Fear of failure (criticism); conformity"], "expl": "Sana hesitates because she fears criticism (fear of failure). The others follow the conventional, already-spoken line of thought to fit in (conformity).", "type": "mcq", "id": 14, "ans": 3}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "", "q": "Functional fixedness is best defined as:", "opts": ["Hesitation to propose ideas because of fear of criticism", "Over-reliance on past solutions by experienced people", "The tendency to see objects only for their traditional purpose, limiting creative problem-solving", "Rejecting ideas before exploring them fully"], "expl": "The other options define fear of failure, premature judgment and the expertise trap respectively.", "type": "mcq", "id": 15, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "A mechanic needs to seal a leaking pipe. A discarded cycle inner tube lies nearby, but he sees it only as 'a tube for tyres' and goes to buy a rubber seal.", "q": "Which concept explains his behaviour?", "opts": ["Premature judgment", "Fear of failure", "Functional fixedness", "Conformity"], "expl": "He sees the object only for its conventional purpose, although a cut piece of the tube would serve as a seal.", "type": "mcq", "id": 16, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "During a design review, a manager rejects each suggestion within seconds, before the team has explored how it might work.", "q": "Which cognitive block does this show?", "opts": ["Conformity", "Functional fixedness", "Premature judgment", "The expertise trap"], "expl": "Premature judgment is rejecting ideas before exploring them fully. It is also why judgment must be deferred during ideation.", "type": "mcq", "id": 17, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "", "q": "According to the notes, Design Thinking helps break cognitive blocks through:", "opts": ["Empathy, experimentation, collaboration and structured creative problem-solving", "Finishing each phase completely before starting the next", "Strict reuse of previously successful solutions", "Keeping users out of the process to avoid bias"], "expl": "DT links directly to the blocks: empathy challenges assumptions, experimentation reduces fear of failure, and collaboration widens perspectives.", "type": "mcq", "id": 18, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "", "q": "Define functional fixedness. Describe the property-listing technique and demonstrate it on an everyday object of your own choice (list at least four properties with uses).", "model": "Definition: tendency to see objects only for their traditional purpose, limiting creative problem-solving.\nTechnique: stop thinking about the object, list its properties, then find a use for each property.\nExample, an old CD: reflective -> signal mirror, bird scarer; flat and round -> coaster, drawing template; has a central hole -> hang as a decoration, spindle/stand; thin and rigid -> scraper, spacer.\nBenefit: properties unlock uses that thinking about 'a CD' never would.", "marks": 5, "type": "sub", "id": 19}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "", "q": "Explain four common cognitive blocks with an original example of each, and state how Design Thinking helps overcome them.", "model": "Fear of failure: hesitation to propose ideas due to fear of criticism (e.g., a student stays silent in a group).\nConformity: following conventional thinking to fit in (e.g., everyone repeats the first idea).\nPremature judgment: rejecting ideas before exploring them (e.g., 'too costly' said immediately).\nExpertise trap: over-reliance on past solutions (e.g., reusing last project's design).\nDT remedies: empathy, experimentation (cheap prototypes make failure safe), collaboration ('yes, and'), and structured creative problem-solving that separates generating from judging.", "marks": 10, "type": "sub", "id": 20}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "A university lab builds the first working prototype of a battery chemistry that has never existed before, but no company has adopted it. Separately, a start-up takes ordinary existing batteries and builds a battery-swap service for e-rickshaw drivers that thousands use daily.", "q": "How should the two be classified according to the course?", "opts": ["Lab: innovation; start-up: invention", "Lab: creativity only; start-up: invention", "Both are inventions, since both involve batteries", "Lab: invention; start-up: innovation"], "expl": "Invention = creating something entirely new. Innovation = successfully implementing ideas to create value. Creativity becomes innovation only when it delivers value.", "type": "mcq", "id": 21, "ans": 3}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "A local tiffin service adds a mobile app for ordering its existing meals. A new firm, with no restaurants, launches shared cloud kitchens that deliver office meals at half the price to people who previously could not afford regular ordering.", "q": "Which classification is most accurate?", "opts": ["The app is a disruptive innovation; the cloud-kitchen firm is an incremental improvement", "The app is an incremental improvement; the cloud-kitchen firm is a disruptive innovation", "Both are disruptive because both use technology", "Both are incremental because both sell meals"], "expl": "Incremental = small but meaningful improvements to an existing product or process. Disruptive = a new product, service or business model that transforms markets with simpler, cheaper or more accessible solutions and serves unmet needs.", "type": "mcq", "id": 22, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "", "q": "Which option correctly defines all three terms?", "opts": ["Creativity: generating original and useful ideas; Invention: creating something entirely new; Innovation: successfully implementing ideas to create value", "Creativity, invention and innovation are three words for the same thing", "Creativity: creating something entirely new; Invention: generating original ideas; Innovation: improving cost", "Creativity: implementing ideas for value; Invention: generating ideas; Innovation: creating something new"], "expl": "Creativity becomes innovation only when it delivers value.", "type": "mcq", "id": 23, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "A phone maker's new model has a slightly better battery and camera than last year's model.", "q": "How is this best described?", "opts": ["Disruptive innovation", "Incremental invention", "Invention of an entirely new category", "A wicked problem"], "expl": "Incremental invention means small but meaningful improvements to an existing product or process.", "type": "mcq", "id": 24, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "A firm launches a simple, pay-as-you-go solar lamp service for households without reliable electricity, creating a new market and challenging kerosene suppliers.", "q": "What makes this a disruptive innovation?", "opts": ["It offers a simpler, cheaper, more accessible solution to unmet needs and creates a new market", "It is purely an idea with no users yet", "It succeeds only because it is technologically the most advanced lamp", "It only adds a small feature to an existing lamp"], "expl": "Disruptive innovation transforms markets with simpler, cheaper or more accessible solutions, challenges incumbents and focuses on unmet customer needs.", "type": "mcq", "id": 25, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "", "q": "Differentiate creativity, invention and innovation with one original example each. Why does creativity become innovation only when it delivers value?", "model": "Creativity: ability to generate original and useful ideas (e.g., imagining a bus that adjusts its route to demand).\nInvention: creating something entirely new that did not exist before (e.g., the first working device of a new type).\nInnovation: successfully implementing creative ideas to create value (e.g., a ride-pooling service that thousands use).\nIdea -> creativity; new thing -> invention; value -> innovation. An idea or invention that no one uses creates no value and so is not yet innovation.", "marks": 5, "type": "sub", "id": 26}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "", "q": "Distinguish incremental invention from disruptive innovation. Give two examples of each and list the characteristics of disruptive innovation.", "model": "Incremental: small but meaningful improvements to an existing product/process (e.g., USB to USB Type-C; petrol cars to hybrid cars).\nDisruptive: a new product, service or business model that transforms markets with simpler, cheaper or more accessible solutions (e.g., streaming replacing rental stores; ride-hailing replacing traditional taxi booking).\nCharacteristics: creates new markets, challenges incumbents, focuses on unmet customer needs.", "marks": 5, "type": "sub", "id": 27}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Kinds of Problems", "case": "Consider three tasks: (a) compute the maximum bending stress in a beam under given loads; (b) design a mobile app that improves student well-being on a campus; (c) reduce air pollution across a metropolitan region where industry, commuters, farmers and regulators have conflicting interests.", "q": "How should the problems be classified?", "opts": ["(a) well-defined; (b) wicked; (c) ill-defined", "(a) well-defined; (b) ill-defined; (c) wicked", "(a) ill-defined; (b) wicked; (c) well-defined", "(a) wicked; (b) ill-defined; (c) well-defined"], "expl": "Well-defined: clear goals and one correct answer. Ill-defined: unclear goals or paths, many solutions (app design). Wicked: complex and interconnected, answers are better or worse, not right or wrong (climate, poverty, healthcare).", "type": "mcq", "id": 28, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Kinds of Problems", "case": "", "q": "Which is a feature of wicked problems?", "opts": ["They are complex and interconnected, and solutions are better or worse rather than right or wrong", "They have clear goals and constraints", "They have one correct answer", "They are solved by applying a standard formula"], "expl": "Examples: climate, poverty, healthcare.", "type": "mcq", "id": 29, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Kinds of Problems", "case": "", "q": "Why does the course say Design Thinking exists?", "opts": ["Engineering education is useless for all kinds of problems", "Ill-defined and wicked problems do not yield to the methods that work on well-defined ones", "Well-defined problems cannot be solved by engineers", "Because linear pipelines are always faster"], "expl": "Traditional engineering education trains you superbly on well-defined problems; the other two kinds need iterative, human-centred methods.", "type": "mcq", "id": 30, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Kinds of Problems", "case": "", "q": "Explain well-defined, ill-defined and wicked problems with an example of each, and state why traditional engineering education alone is not enough.", "model": "Well-defined: clear goals, constraints and solution; one correct answer (equations, puzzles, technical fixes).\nIll-defined: unclear goals or paths, many possible solutions (app design, marketing strategy).\nWicked: complex and interconnected; solutions are better or worse, not right or wrong (climate, poverty, healthcare).\nTraditional engineering education trains students superbly on well-defined problems; the other two kinds do not yield to the same methods, so human-centred, iterative approaches (Design Thinking) are needed.", "marks": 5, "type": "sub", "id": 31}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "Two groups are given the same unfamiliar layout puzzle. Group X spends most of its time analysing the rules before attempting any arrangement. Group Y quickly tries many arrangements, learns from what fails, and refines.", "q": "In line with Lawson's experiment, which description is correct?", "opts": ["X behaves like designers (solution-focused); Y behaves like scientists (problem-focused)", "X behaves like scientists (problem-focused); Y behaves like designers (solution-focused)", "Both are solution-focused because both aim to finish the puzzle", "X is solution-focused and Y is problem-focused because Y analysed its failures"], "expl": "Lawson's key insight: scientists analyse thoroughly before proposing solutions; designers create and test many solutions rapidly, learning through iteration.", "type": "mcq", "id": 32, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "A start-up's smart lunchbox is loved by test users, and engineers confirm it can be manufactured. But the cost of making and shipping each unit is higher than the selling price, with no route to profit.", "q": "Which IDEO lens is failing, and what does that imply?", "opts": ["Viability; meeting only two of the three lenses produces a concept that fails in practice", "Desirability; users do not want the product", "Feasibility; the product cannot be built", "None; strong desirability alone guarantees innovation"], "expl": "IDEO's three overlapping lenses: desirability (do people want it?), feasibility (can we build it?), viability (is it economically sustainable?). Genuine innovation lies where all three overlap.", "type": "mcq", "id": 33, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "A company builds an internal HR portal using Plan → Build → Test → Ship over fourteen months. In launch week, employees say the navigation does not match how they work, and fixing it requires redoing large parts of the build.", "q": "Which characteristic of this process most directly caused the costly rework?", "opts": ["The team iterated with users too often", "User feedback arrives only at the end of a linear sequence, so changes are costly", "The team spent too long on empathy and prototyping", "The team followed the Stanford d.school loop too strictly"], "expl": "Traditional waterfall is linear, each phase finished before the next, with user feedback at the end. Human-centred design is iterative, with empathy, feedback, prototyping and refinement throughout (CO1).", "type": "mcq", "id": 34, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "Residents of a hostel complain about laundry. A team makes a cardboard-and-paper mock-up of a token-based drop-off counter and asks residents to pretend to use it while the team notes where they get confused.", "q": "Which two Stanford d.school stages is the team performing?", "opts": ["Prototype and Test", "Ideate and Prototype", "Empathize and Define", "Define and Ideate"], "expl": "Building a simple model is Prototype; evaluating it with users is Test. The results then feed back into earlier stages: the process is iterative, not linear.", "type": "mcq", "id": 35, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "Who is credited in the notes with coining the term 'wicked problems' in the mid-1960s?", "opts": ["Rittel", "Herbert Simon", "Nigel Cross", "Rowe"], "expl": "Mid-1960s: design methods movement, Rittel coins 'wicked problems'. Simon (1969–70s) framed design as a way of thinking.", "type": "mcq", "id": 36, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "Which pairing of date and event is correct?", "opts": ["1991: Stanford d.school established; 2005: IDEO founded", "1991: IDEO founded; 2005: Stanford d.school established", "2005: Rittel coins 'wicked problems'; 1991: Simon publishes", "1969–70s: IDEO founded; 1982–87: d.school established"], "expl": "Timeline: mid-1960s design methods, 1969–70s Simon, 1982–87 Cross and Rowe, 1991 IDEO, 2005 d.school, today across industries.", "type": "mcq", "id": 37, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "What is the correct order of the Stanford d.school stages?", "opts": ["Empathize, Ideate, Define, Test, Prototype", "Define, Empathize, Ideate, Test, Prototype", "Empathize, Define, Ideate, Prototype, Test", "Ideate, Define, Empathize, Prototype, Test"], "expl": "Testing feeds back into empathy; the process is iterative, not linear.", "type": "mcq", "id": 38, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "In the IDEO framework, the 'desirability' lens asks:", "opts": ["Will competitors copy it?", "Do people want this?", "Can we build this?", "Is it economically sustainable?"], "expl": "Desirability = do people want it; feasibility = can we build it; viability = is it economically sustainable.", "type": "mcq", "id": 39, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "A team proposes a concept that users love and that would be profitable, but the required technology does not exist yet.", "q": "Which IDEO lens fails?", "opts": ["Viability", "None of them", "Desirability", "Feasibility"], "expl": "Users want it (desirable) and it makes money (viable), but it cannot be built yet (not feasible).", "type": "mcq", "id": 40, "ans": 3}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "A government-built app is technically sound and cheap to run, but citizens find its purpose unclear and avoid it.", "q": "Which lens is missing?", "opts": ["Legal compliance", "Desirability", "Feasibility", "Viability"], "expl": "A technical success without user desirability sits outside the overlap of the three lenses.", "type": "mcq", "id": 41, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "The Stanford d.school and IDEO frameworks are best described as:", "opts": ["Identical frameworks with the same stages", "Competing methods where you must pick one", "Applicable only to physical products", "Complementary lenses, not rivals"], "expl": "d.school describes the process stages; IDEO's three lenses test whether the outcome is desirable, feasible and viable.", "type": "mcq", "id": 42, "ans": 3}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "Trace the history and evolution of Design Thinking from the 1960s to today.", "model": "Mid-1960s: design methods movement; Rittel coins 'wicked problems'.\n1969–70s: Herbert Simon presents design as a way of thinking.\n1982–87: Nigel Cross (Designerly Ways of Knowing); Rowe publishes Design Thinking.\n1991: IDEO founded; pioneers human-centred design.\n2005: Stanford d.school established.\nToday: applied across industries worldwide.", "marks": 5, "type": "sub", "id": 43}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "Explain Lawson's experiment and what it implies for how engineering students should approach an open design brief.", "model": "Key insight: scientists are problem-focused (analyse thoroughly before proposing solutions); designers are solution-focused (create and test many solutions rapidly, learning through iteration).\nImplication: on open briefs, do not wait for complete analysis; prototype many options early, test, and learn from feedback; use analysis to interpret results rather than to delay action.", "marks": 5, "type": "sub", "id": 44}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "Describe the five stages of the Stanford d.school framework. Why is the process described as iterative rather than linear?", "model": "1. Empathize: understand users' needs and challenges.\n2. Define: pinpoint the core problem.\n3. Ideate: generate many ideas.\n4. Prototype: build a simple model.\n5. Test: evaluate and refine with users.\nIterative: results from testing feed back into earlier stages (even Empathize); you loop back and improve rather than finishing each phase once.", "marks": 10, "type": "sub", "id": 45}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "A company launches a premium smart helmet with advanced sensors, priced at ₹18,000, aimed at two-wheeler riders in small towns. Sales are very low.", "q": "Analyse the likely reasons using IDEO's desirability, feasibility and viability lenses, and state what evidence you would collect before relaunching.", "model": "Desirability: do small-town riders want or trust it? Many may see no clear problem solved, or the price may be too high (price vs value).\nFeasibility: technology works, but servicing, charging and distribution in small towns may be hard.\nViability: at this price, volume is too low for sustainable economics.\nA product that sits outside the overlap of all three lenses fails in practice.\nEvidence: interviews and observation of riders (what they do, not just say), willingness-to-pay tests, prototype trials with a simpler model, cost and service-network analysis.", "marks": 10, "type": "sub", "id": 46}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "Compare the traditional waterfall model with human-centred design, and explain why this distinction is central to CO1.", "model": "Waterfall: linear, step-by-step (Plan, Build, Test, Ship); each phase is finished before the next; user feedback arrives at the end, so changes are costly.\nHCD: iterative and user-focused; empathy, continuous feedback, prototyping and refinement throughout; testing loops back to empathy.\nCO1 asks students to explain human-centred principles and differentiate iterative workflows from linear pipelines; early user feedback reduces the cost of failure.", "marks": 5, "type": "sub", "id": 47}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking Mindset", "case": "", "q": "Which is NOT one of the 'three beliefs' of Design Thinking?", "opts": ["Ideas improve by being tested, not by being argued", "Failure early is cheaper than failure late", "Problems are best understood from the user's side", "The best idea is the one proposed by the most senior person"], "expl": "The three beliefs are the user's side, testing over arguing, and failing early.", "type": "mcq", "id": 48, "ans": 3}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking Mindset", "case": "A start-up tests a paper mock-up with five users in the first week and discovers a fatal navigation flaw, instead of finding it after six months of coding.", "q": "Which DT belief does this illustrate?", "opts": ["Problems are best understood from the user's side", "Failure early is cheaper than failure late", "Incremental invention beats disruption", "Creativity always needs a large budget"], "expl": "Early, cheap prototypes expose flaws before expensive commitment.", "type": "mcq", "id": 49, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking Mindset", "case": "", "q": "Which set lists the skills Unit 1 aims to develop?", "opts": ["SCAMPER, brainstorming, prioritisation", "Metacognition, self-awareness, creative confidence, critical thinking", "Prototyping, usability testing, deployment", "Persona building, interviewing, synthesis"], "expl": "The unit overview lists these skills; interviewing and personas belong to Unit 2, ideation tools to Unit 3.", "type": "mcq", "id": 50, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "Night-shift students at a hostel struggle to find food after 10 pm. Three staff respond. P: 'Poor students, they must be so exhausted.' Q: 'I waited at the gate for two nights and saw the canteen shutter closes at 9:45 while the exam block stays open till midnight.' R: 'So starting this week we are extending canteen hours to 11:30 pm.'", "q": "Which labels fit P, Q and R?", "opts": ["P sympathy; Q compassion; R empathy", "P compassion; Q empathy; R sympathy", "P empathy; Q sympathy; R compassion", "P sympathy; Q empathy; R compassion"], "expl": "Sympathy = feeling for someone from a distance. Empathy = understanding the situation as they experience it. Compassion = empathy plus the decision to act.", "type": "mcq", "id": 51, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "Final-year computer-science students design a revision app for rural Class-10 pupils. Their lead says, 'We were students too, so we already know what students need,' and skips user conversations.", "q": "What is the main flaw, and the best corrective discipline?", "opts": ["They are too young; they should hire older designers", "They should skip qualitative work and run only a large survey", "They should build the app immediately, because prototypes replace conversations", "Their own experience becomes the whole sample; treat it as one hypothesis and check it with several people who are not them"], "expl": "'You are not the user.' Assuming you know what users want because you might be one yourself is the most common mistake. The discipline: 'I think I know. Let me check with six people who are not me.'", "type": "mcq", "id": 52, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "A bank's chatbot replies 'I'm so sorry to hear that' to every complaint, using the same sentence whether a customer reports a failed ₹50 transfer or a frozen salary account, and never adapts its next step to the person's situation.", "q": "Which assessment is best?", "opts": ["It demonstrates the say–do gap", "It is a good example of computational empathy because it expresses feeling", "It shows compassion because it takes action for the customer", "It imitates empathetic wording but lacks computational empathy, which needs systems that understand and respond to a person's behaviour and emotions"], "expl": "Computational empathy applies empathy to software: systems that understand and respond to human emotions and behaviour, often using AI. A fixed script that ignores context does not do that.", "type": "mcq", "id": 53, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "", "q": "In Design Thinking, empathy means:", "opts": ["Agreeing to every request users make", "Understanding users' feelings, experiences, motivations, frustrations and goals from their point of view", "Feeling pity for users from a distance", "Assuming users want what the designer would want"], "expl": "Pity from a distance is sympathy; empathy reveals hidden needs so we solve actual rather than assumed problems.", "type": "mcq", "id": 54, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "", "q": "The 'empathy habit' consists of:", "opts": ["Define, ideate and prototype", "Ask, build and test", "See, feel and listen", "Read, write and reflect"], "expl": "See the world through their eyes, feel their emotions and pain points, listen to their experiences and stories.", "type": "mcq", "id": 55, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "", "q": "Which is the best example of computational empathy?", "opts": ["A static FAQ page", "A printed user manual", "A form with mandatory fields", "A learning app that adapts difficulty to the learner's performance"], "expl": "Computational empathy: systems that understand and respond to human emotions and behaviour, often using AI (e.g., adaptive learning).", "type": "mcq", "id": 56, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "", "q": "Define empathy in the context of Design Thinking and explain why it matters. Differentiate sympathy, empathy and compassion.", "model": "Empathy: ability to understand another person's feelings, experiences, motivations, frustrations and goals; in DT, seeing the world from the user's point of view (what users think, feel, say and do).\nImportance: better insights, prevents assumptions, reveals hidden problems, builds trust, produces meaningful solutions.\nSympathy: feeling for someone from a distance. Empathy: understanding a situation as they experience it. Compassion: empathy plus the decision to act.\nPity produces charity, empathy produces design, compassion produces change.", "marks": 10, "type": "sub", "id": 57}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "", "q": "Explain the 'You are not the user' trap and the discipline that overcomes it.", "model": "Trap: assuming you know what users want because you might be one yourself ('I'm a student too, so I know what students need'); your experience becomes the whole sample.\nDiscipline: treat your experience as one hypothesis and check with several people who are not you (e.g., six interviews).\nEveryone experiences products differently; evidence replaces assumption.", "marks": 5, "type": "sub", "id": 58}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "", "q": "Define computational empathy. Give three examples and discuss whether a machine can have empathy or only simulate it.", "model": "Definition: applying empathy to software development, designing systems that understand and respond to human emotions and behaviour, often using AI.\nExamples: chatbots/virtual assistants understanding intent; recommendation systems suiting mood or habits; healthcare apps monitoring well-being; educational apps adapting to performance.\nDiscussion: systems can detect patterns and respond appropriately (simulation), but whether they actually feel is debatable; for design, the useful test is whether the response is accurate, context-aware and helpful rather than scripted.", "marks": 5, "type": "sub", "id": 59}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "User Research Methods", "case": "An e-commerce firm sees that most mobile users leave at the payment page. The team wants to understand why, and then to know how widespread each reason is.", "q": "Which research plan best matches the course?", "opts": ["Run A/B tests on button colours only; reasons are unnecessary", "Run a large survey first, then interview users", "Interview and observe a few users to discover reasons, then validate the strongest ones at scale with a survey or analytics", "Interview 500 users and treat the percentages as the whole finding"], "expl": "Use qualitative research to discover insights, then quantitative research to validate them at scale. They are partners, not rivals.", "type": "mcq", "id": 60, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "User Research Methods", "case": "A: eight interviews to learn why commuters skip a feeder bus. B: an A/B test of two ticket-button designs across 20,000 sessions. C: observing ten shoppers inside a pharmacy.", "q": "How should A, B and C be classified?", "opts": ["A quantitative; B qualitative; C quantitative", "A qualitative; B quantitative; C qualitative", "A quantitative; B quantitative; C qualitative", "A qualitative; B qualitative; C quantitative"], "expl": "Qualitative: understanding why and how (interviews, observation; small samples of about 5–20). Quantitative: measuring what and how many (surveys, analytics, A/B tests; large samples).", "type": "mcq", "id": 61, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "User Research Methods", "case": "", "q": "Typical sample sizes for the two research approaches are:", "opts": ["Qualitative: 100+; quantitative: about 5–20", "Qualitative: about 5–20 participants; quantitative: 100+", "Both: fewer than 10", "Both: 100+"], "expl": "Qualitative explores why and how in depth; quantitative measures what and how many at scale.", "type": "mcq", "id": 62, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "User Research Methods", "case": "A team wants to know whether a new checkout layout raises completion rates across thousands of sessions.", "q": "Which method fits best?", "opts": ["An A/B test (quantitative)", "A small focus group (qualitative)", "Observing five users at home", "Building an empathy map"], "expl": "A/B tests, surveys and analytics validate hypotheses at scale.", "type": "mcq", "id": 63, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "User Research Methods", "case": "", "q": "Compare qualitative and quantitative user research on focus, methods, data type, sample size and best use. Explain the recommended sequence.", "model": "Focus: qualitative = why and how; quantitative = what and how many.\nMethods: interviews, observations, focus groups vs surveys, analytics, A/B tests.\nData: words, behaviours, emotions vs numbers, statistics, metrics.\nSample: small (5–20) vs large (100+).\nBest for: exploring problems and generating insights vs validating hypotheses and measuring scale.\nSequence: use qualitative research to discover insights, then quantitative research to validate them at scale; they are partners, not rivals.", "marks": 10, "type": "sub", "id": 64}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "Notes from a railway ticket counter: (1) 14 people queue to buy tickets; (2) glare on the kiosk screens in afternoon sun; (3) three passengers ask staff for help with the touchscreen; (4) most carry cash and a phone.", "q": "Which mapping to AEIOU is correct?", "opts": ["1 Interactions; 2 Objects; 3 Activities; 4 Users", "1 Users; 2 Environment; 3 Objects; 4 Activities", "1 Activities; 2 Objects; 3 Environment; 4 Interactions", "1 Activities; 2 Environment; 3 Interactions; 4 Objects"], "expl": "A = Activities (what people do), E = Environment (where they do it, e.g., lighting), I = Interactions (how they engage with people or systems), O = Objects (what they use), U = Users (who they are).", "type": "mcq", "id": 65, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "Four team members submit notes from a visit to a bank branch.", "q": "Which note is a genuine observation rather than a judgement?", "opts": ["'Six of fifteen customers asked the same question about how to fill the deposit slip.'", "'The counter staff are rude.'", "'Customers are impatient.'", "'The deposit slip design is confusing.'"], "expl": "Observations are factual, countable behaviour. 'Rude', 'impatient' and 'confusing' are judgements or inferences. Observe and record first; understand later.", "type": "mcq", "id": 66, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "A team plans to study how students struggle with hostel Wi-Fi. They propose photographing students in the common room, interviewing people in their hostel rooms, and writing each person's full name in the notes.", "q": "Which revised plan best follows the ethics and consent guidance?", "opts": ["Continue as planned, since observing public places means individuals can be studied without agreement", "Photograph people but blur faces later, and interview in hostel rooms once the warden agrees", "Take one consent from the warden for everyone and record full names to avoid confusion", "Observe public areas, read a consent script before interviewing, record initials or pseudonyms, and sketch the scene instead of photographing people"], "expl": "Ask first; say who you are (consent script); stay anonymous; do not photograph people; be safe and avoid residential spaces such as hostel rooms. Informed consent is itself a practice of human-centred design.", "type": "mcq", "id": 67, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "", "q": "In field observation, the designer should:", "opts": ["Ask leading questions to speed up findings", "Stage tasks in a laboratory only", "Intervene to correct users' mistakes", "Observe users in their natural environment without interrupting or influencing behaviour"], "expl": "'Be a fly on the wall': do not interrupt or influence; take notes discreetly. Observe what they actually do, not what they say.", "type": "mcq", "id": 68, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "At a school bus stop, a researcher records shade, noise level and crowding.", "q": "Which AEIOU letter do these notes belong to?", "opts": ["Activities", "Objects", "Environment", "Users"], "expl": "Lighting, noise, temperature, space and technology are key environmental factors.", "type": "mcq", "id": 69, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "", "q": "In AEIOU, which letter answers 'who they are'?", "opts": ["O (Objects)", "U (Users)", "A (Activities)", "I (Interactions)"], "expl": "A = what people do, E = where, I = how they engage, O = what they use, U = who they are.", "type": "mcq", "id": 70, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "", "q": "Which set of statements best matches the verbal consent script?", "opts": ["Tell participants that taking part is required by the course", "Offer a reward and record full names", "State who you are and the purpose, say it takes about five minutes, is voluntary, can be stopped or skipped, and no name will be recorded", "Start the interview and ask permission at the end"], "expl": "Consent must be informed and voluntary; participants can stop or skip any question at any time.", "type": "mcq", "id": 71, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "A pair wants to observe students inside hostel rooms; their faculty mentor cannot be reached.", "q": "What should they do?", "opts": ["Go at night when rooms are quiet", "Take photographs to keep accurate records", "Go ahead since they are working in pairs", "Avoid residential spaces and choose a public area such as a library reading area or corridor; ask the mentor first if in doubt"], "expl": "Suitable sites are public and appropriate; avoid residential spaces such as hostel rooms; if in doubt ask your faculty mentor before you begin.", "type": "mcq", "id": 72, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "", "q": "Explain the AEIOU framework with an observation example for each letter, using a bus-ticket vending machine as the setting.", "model": "A (Activities): users select destination, insert cash, collect ticket.\nE (Environment): outdoor station, glare on screen, noise, crowding.\nI (Interactions): users ask a staff member or stranger for help when the machine rejects a note.\nO (Objects): the machine, coins and notes, phones for reading fares.\nU (Users): commuters, some elderly or first-time users, often in a hurry.\nAEIOU lets you study users and their activities systematically from five perspectives and identify problems.", "marks": 10, "type": "sub", "id": 73}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "", "q": "Explain the What–How–Why framework using an example of your own, and state why inference must be labelled.", "model": "WHAT: observe objectively what the user does (e.g., opens a ticket app, selects a train, scrolls fares).\nHOW: analyse how they do it, including effort, emotions and difficulties (e.g., compares options repeatedly, hesitates at payment).\nWHY: identify motivations, emotions and needs (e.g., worried about price or refund), the stage where inference begins.\nInference must be labelled and verified because observation without interpretation is data, and interpretation without observation is guesswork.", "marks": 5, "type": "sub", "id": 74}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "", "q": "List and justify the key principles of research ethics and informed consent in user research.", "model": "Ask first: never interview or photograph a person without clear permission; observing public activity is fine, studying an individual is not unless they agree.\nSay who you are: use the consent script every time (purpose, about five minutes, voluntary, can stop or skip, name not recorded).\nStay anonymous: pseudonyms or initials.\nDo not photograph people: sketch the scene.\nBe safe: open, public, daylight, in pairs; avoid residential spaces; consult the mentor if in doubt.\nInformed consent is itself a practice of human-centred design: it respects the user.", "marks": 5, "type": "sub", "id": 75}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "A team preparing to interview patients about a pharmacy home-delivery service drafts four possible questions.", "q": "Which is the best interview question?", "opts": ["'Don't you think delivery is too slow?'", "'Is the app easy to use?'", "'Tell me about the last time you ordered medicines — what happened?'", "'Would you pay ₹30 more for faster delivery?'"], "expl": "Good questions are open-ended, non-leading, exploratory and about real experience. The others are leading, hypothetical and closed (yes/no). 'Tell me about the last time…' invites a specific story.", "type": "mcq", "id": 76, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "A student says she skips 8 a.m. lectures. Why? 'I'm too tired.' Why? 'I sleep at 3 a.m.' Why? 'Assignments pile up and I finish them at night.' Why? 'Several faculty release assignments on Thursday evening, all due on Friday.'", "q": "Which design-actionable root cause did the ladder reach, and what does it show?", "opts": ["Uncoordinated assignment release and deadlines across courses; the first answer ('too tired') was only a symptom", "Early lecture timing; the first Why was the real one", "Tiredness; the team should design a sleep-tracking app", "Student laziness; attendance penalties are the answer"], "expl": "The Five Whys peel back layers until you reach a cause you can design for. The first Why is almost never the real one.", "type": "mcq", "id": 77, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "", "q": "A question that cannot be answered yes/no and does not suggest an answer is:", "opts": ["Solution-centred", "Open-ended and non-leading", "Hypothetical", "Closed and leading"], "expl": "Good questions are open-ended, non-leading, exploratory and user-focused, about experiences, not hypotheticals.", "type": "mcq", "id": 78, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "", "q": "The '80/20 rule' for interviewers means:", "opts": ["Listen about 80% of the time and talk about 20%", "Ask 80 questions in 20 minutes", "80% of users reveal 20% of needs", "Talk 80% and listen 20%"], "expl": "Listen more than you talk; do not defend or explain your ideas.", "type": "mcq", "id": 79, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "An interviewer says, 'Walk me through your typical morning, from waking up to reaching class.'", "q": "Which technique is this?", "opts": ["The Five Whys", "Grand tour", "Embrace silence", "Seek contradictions"], "expl": "Grand tour invites a full walk-through of a typical routine.", "type": "mcq", "id": 80, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "", "q": "State the characteristics of good interview questions. Rewrite these poor questions: (a) 'Do you like the sports complex?' (b) 'Would you use an app to book badminton courts?' (c) 'Don't you think the bus fare is too high?'", "model": "Good questions are open-ended, non-leading, exploratory and user-focused (experiences, not hypotheticals).\n(a) closed -> 'Tell me about your last visit to the sports complex.'\n(b) hypothetical and solution-focused -> 'How do you currently book a court? What is frustrating about it?'\n(c) leading -> 'How do you feel about what you pay for the bus?'\nAlso: listen more than you talk (80/20), do not defend your ideas.", "marks": 5, "type": "sub", "id": 81}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "", "q": "Explain the Five Whys technique and demonstrate it on the statement 'I rarely use the campus gym' (write a five-level ladder and state the actionable root cause).", "model": "Technique: keep asking why to peel back layers until you reach a cause you can design for; the first Why is almost never the real one.\nExample ladder: Surface: rarely use the gym. Why 1: it is crowded at 6 pm. Why 2: all classes end at 5:30 so everyone arrives together. Why 3: I can't come at other times because the gym closes at 8 pm and I have labs after. Why 4: the schedule was set for staff convenience. Why 5: I feel I am paying for a facility I cannot use.\nActionable root cause: opening hours and slot allocation do not match student timetables.", "marks": 5, "type": "sub", "id": 82}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "In a survey, 85% of students say they want 'healthier options' in the canteen. Over one month, the salad counter accounts for 6% of sales while fried snacks sell out before 1 p.m.", "q": "How should the team interpret this?", "opts": ["It is a say–do gap: stated preference reflects self-image, observed behaviour reflects need, so investigate why healthier options are not chosen before designing", "Add more salad counters immediately, since 85% asked for them", "Trust the survey and discard the sales data", "Conclude the students lied and discard both sources"], "expl": "Ask what people do; watch what people choose. Stated preference is evidence about self-image; observed behaviour is evidence about need.", "type": "mcq", "id": 83, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "Older users of a cab app tell researchers, 'Please make the text bigger.' Observers notice that each time they ask a neighbour to confirm the booking and hesitate before pressing Confirm.", "q": "Which pairing of explicit and (plausible, to be verified) implicit need is best?", "opts": ["Explicit: asking neighbours; implicit: faster internet", "Explicit: reassurance; implicit: larger text", "Both are explicit, because users mentioned them", "Explicit: larger text; implicit: confidence and reassurance that the booking is right"], "expl": "Explicit needs are what users say they want. Implicit needs are what they actually need, often unspoken, and are revealed through observation and analysis (safety, confidence, comfort, trust). Label such inferences as inferences.", "type": "mcq", "id": 84, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "A team studying delivery riders writes four pain-point statements.", "q": "Which is best formed according to the course?", "opts": ["'Riders probably want better pay.'", "'The platform's support is poor, in our opinion.'", "'7 of 9 riders interviewed waited over 20 minutes, unpaid, at restaurant counters; R4: \"my whole evening goes in waiting.\"'", "'Riders hate the platform.'"], "expl": "Every pain point you record needs evidence: a quote or a count. This one is specific and backed by both. The others are opinion or guesswork.", "type": "mcq", "id": 85, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "", "q": "A user says, 'I want faster checkout.' According to the notes, the underlying implicit need is most likely:", "opts": ["Lower cost", "Better battery", "To feel in control of the process", "Faster internet"], "expl": "Explicit needs are what users say; implicit needs (control, safety, trust) are revealed through observation and analysis.", "type": "mcq", "id": 86, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "Customers of an online service report: 'When payment fails, nobody helps us and we cannot reach anyone.'", "q": "Which pain-point category is this?", "opts": ["Productivity", "Financial", "Support", "Process"], "expl": "Support = lack of help or guidance. Process = inefficient procedures; financial = costs too much money or time; productivity = wastes time or effort.", "type": "mcq", "id": 87, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "", "q": "Distinguish explicit and implicit needs, and explain the say–do gap with an example. How should a designer respond?", "model": "Explicit needs: what users say they want, stated clearly in interviews (e.g., faster app).\nImplicit needs: what users actually need, often unspoken, revealed by observation (e.g., safety, confidence, trust, control).\nSay–do gap: difference between what people report and what they do (e.g., claiming to prefer healthy food but choosing fried snacks).\nResponse: ask what people do; watch what people choose; treat stated preference as evidence of self-image and observed behaviour as evidence of need; investigate the reason before designing.", "marks": 5, "type": "sub", "id": 88}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "", "q": "Define pain points, list their types with an example of each, and explain why every pain point needs evidence.", "model": "Definition: specific problems or frustrations users experience while trying to accomplish a goal.\nTypes: Process (inefficient procedures), Financial (costs too much money or time), Support (lack of help or guidance), Productivity (wastes time or effort).\nEvidence: each recorded pain point needs a quote or a count; otherwise it is opinion or guesswork. Identify the weakest-evidenced pain point and go and find out more.", "marks": 5, "type": "sub", "id": 89}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Personas & Empathy Maps", "case": "A team's persona reads: 'Anita, 34, nurse, wants a quick way to check shift changes; says, \"I can't keep refreshing the roster.\" Loves yoga, drinks green tea, owns two cats.' Their interview notes support only the first part; nothing mentions yoga, tea or cats.", "q": "What should the team do with the unsupported lines?", "opts": ["Move them to the archetype section", "Keep them but present them as direct quotes", "Keep them to make Anita relatable", "Delete them, because every line in a persona must trace to something a real person said or did"], "expl": "A persona is a research summary, not a character you invented. If you cannot point to the interview it came from, delete it.", "type": "mcq", "id": 90, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Personas & Empathy Maps", "case": "A team notes: 'Our target groups are college students, working professionals and senior citizens.' They then pick one group and write a profile of 'Karthik, 22, final-year student', with goals, frustrations and a real quote.", "q": "What do these two outputs represent?", "opts": ["The groups are personas; Karthik is an archetype", "Both are personas", "Both are archetypes", "The groups are archetypes (they help segment); Karthik is a persona (one individual to empathise with)"], "expl": "Archetypes are broad groups with shared behaviour. A persona makes one of those groups concrete enough to design for.", "type": "mcq", "id": 91, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Personas & Empathy Maps", "case": "An empathy map for a language-learning app records. SAYS: 'I love the app.' THINKS: 'I'll restart on Monday.' DOES: opened the app on 2 of the last 14 days. FEELS: guilty.", "q": "Where is the richest design opportunity?", "opts": ["In the gap between what she says (love) and what she does (rare use)", "Nowhere; her positive statement means nothing needs to change", "Only in the FEELS quadrant, since emotion overrides behaviour", "In adding more features, since she says she loves the app"], "expl": "Where SAYS and DOES disagree is usually your best opportunity. Empathy maps synthesise what users say, think, do and feel.", "type": "mcq", "id": 92, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Personas & Empathy Maps", "case": "", "q": "In an empathy map, 'observable actions and behaviours' belong to which quadrant?", "opts": ["SAYS", "DOES", "THINKS", "FEELS"], "expl": "SAYS = direct quotes; THINKS = beliefs and concerns; DOES = observable actions; FEELS = emotions and attitudes.", "type": "mcq", "id": 93, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Personas & Empathy Maps", "case": "", "q": "What is a user persona? List its components, distinguish it from a target archetype, and explain the rule that keeps it honest.", "model": "Persona: a fictional representation of a target user based on real research data.\nComponents: name, demographics, goals, frustrations, needs, behaviours, representative quote.\nArchetype: a broad group with shared behaviour (college students, senior citizens); helps segment. Persona: one individual from that group, helps the team empathise.\nRule: a persona is a research summary; every line must be traceable to something a real person said or did; the quote must be real. Delete anything you cannot trace.", "marks": 10, "type": "sub", "id": 94}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Personas & Empathy Maps", "case": "", "q": "Describe the four quadrants of an empathy map. How do you read the gap between SAYS and DOES, with an example?", "model": "SAYS: direct quotes and statements. THINKS: beliefs and concerns. DOES: observable actions. FEELS: emotions and attitudes.\nPurpose: synthesise observations into a complete view revealing hidden needs, frustrations and opportunities.\nGap example: a user says an app is easy to use but rewatches the same lecture three times; this contradiction usually marks the best opportunity (e.g., content is unclear).", "marks": 5, "type": "sub", "id": 95}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Problem Framing", "case": "A team drafts four problem statements about a hospital canteen, using the format [User] needs [need] because [insight].", "q": "Which is the best problem statement?", "opts": ["'Night-shift nurses need a way to eat a warm meal within their 30-minute break because queueing and billing at the canteen take 20 minutes.'", "'We need a canteen app.'", "'Nurses need a better canteen because they are unhappy.'", "'Build a self-checkout kiosk for the hospital canteen.'"], "expl": "A good statement names a user, a need and an insight, and inspires solutions without naming one. 'We need an app' and 'build a kiosk' bake the solution in.", "type": "mcq", "id": 96, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Problem Framing", "case": "A team working on confusion in a hospital's out-patient department (OPD) drafts four candidate questions.", "q": "Which passes the Goldilocks test for a How Might We question?", "opts": ["'Why do patients not read the signs?'", "'How might we add a QR code to the OPD token slip?'", "'How might we improve healthcare?'", "'How might we help first-time patients feel confident about where to go in the OPD?'"], "expl": "Too broad gives nothing usable; too narrow smuggles in the solution. Aim for the middle: a real human need with no solution attached, and framed as an opportunity.", "type": "mcq", "id": 97, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Problem Framing", "case": "", "q": "Why is 'We need a smart dustbin app' a poor problem statement?", "opts": ["It names the user but not the solution", "It is too long", "It has no user, need or insight, and the solution is already baked in", "It follows the [User] needs [need] because [insight] format"], "expl": "A good statement frames the challenge clearly and inspires solutions without naming one.", "type": "mcq", "id": 98, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Problem Framing", "case": "Elderly commuters at a metro station struggle with ticket machines.", "q": "Write a problem statement in the [User] needs [need] because [insight] format and one How Might We question that passes the Goldilocks test. Explain your choices.", "model": "Problem statement: 'Elderly commuters need a way to buy a ticket without help because the machine's small text and many steps make them anxious about holding up the queue.'\nHMW: 'How might we help elderly commuters feel confident buying a ticket on their own?'\nWhy it works: user, need and insight are specific; no solution is named. HMW is not too broad ('improve public transport') nor too narrow ('add a bigger button'); it reframes the problem as an opportunity.", "marks": 10, "type": "sub", "id": 99}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Problem Framing", "case": "A team wants to design a digital-payment solution for street vendors.", "q": "Describe how you would apply the Unit 2 pipeline (observe, interview, dig, separate needs, build persona and empathy map, frame) to this project, including ethical safeguards.", "model": "Observe: AEIOU scan at vendor stalls (activities, environment such as crowd and noise, interactions with customers, objects such as cash box and phone, users); count something (e.g., payments per hour).\nInterview: seek consent with the script; open, non-leading questions; ask for stories of the last payment problem.\nDig: Five Whys on a complaint to reach an actionable root cause.\nSeparate: explicit needs (e.g., instant settlement) from implicit needs (trust, control over money); note any say–do gap.\nBuild: one persona traced to interviews and an empathy map.\nFrame: problem statement then an HMW tested with Goldilocks.\nEthics: ask first, pseudonyms, no photos, public daytime sites, work in pairs.", "marks": 10, "type": "sub", "id": 100}, {"unit": "Unit 3 — Ideation & Creative Problem Solving", "topic": "Ideation & Creative Problem Solving", "case": "A city engineer receives many complaints about potholes and immediately starts comparing bids from road contractors, without checking where, when and why the damage keeps recurring.", "q": "Which CPS stage was rushed, and what does it risk?", "opts": ["Clarify; the team may solve the assumed problem rather than the real one", "Develop; the ideas were scored too carefully", "Ideate; too many ideas were generated", "Implement; the solution was launched too slowly"], "expl": "Clarify means identifying the real problem before searching for solutions: understanding needs, collecting facts and asking 'Why?' to reach the root cause.", "type": "mcq", "id": 101, "ans": 0}, {"unit": "Unit 3 — Ideation & Creative Problem Solving", "topic": "Ideation & Creative Problem Solving", "case": "A team (i) interviews residents and runs a Five Whys on water shortage, (ii) lists forty possible solutions, (iii) scores them on cost and feasibili
