<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INT335 CA Practice — MCQ Tool</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --ink: #1c2530;
    --ink-soft: #5b6672;
    --accent: #3a5fcd;
    --accent-dark: #2a47a8;
    --green: #1e8e5a;
    --green-bg: #e7f7ef;
    --red: #d0402a;
    --red-bg: #fdeceb;
    --border: #e1e5eb;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 20px 14px 60px;
  }
  .wrap { max-width: 700px; margin: 0 auto; }
  header.top {
    text-align: center;
    margin-bottom: 22px;
  }
  header.top h1 {
    font-size: 1.35rem;
    margin: 0 0 4px;
    font-weight: 700;
  }
  header.top p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.92rem;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: 0 2px 10px rgba(20,30,50,0.06);
    border: 1px solid var(--border);
  }

  /* MENU */
  .menu-section { margin-bottom: 18px; }
  .menu-section h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0 0 10px;
    font-weight: 700;
  }
  .unit-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    text-align: left;
    background: #fafbfd;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 10px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    color: var(--ink);
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .unit-btn:hover { border-color: var(--accent); background: #f2f5ff; }
  .unit-btn:active { transform: scale(0.99); }
  .unit-btn .meta {
    font-weight: 500;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }
  .unit-btn .arrow { color: var(--accent); font-size: 1.1rem; margin-left: 10px; }

  /* PROGRESS BAR */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .progress-track {
    flex: 1;
    height: 8px;
    background: var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 6px;
    transition: width 0.25s ease;
  }
  .progress-label {
    font-size: 0.8rem;
    color: var(--ink-soft);
    white-space: nowrap;
    font-weight: 600;
  }

  .qtop {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }
  .qtag {
    display: inline-block;
    background: #eef1fb;
    color: var(--accent-dark);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .score-pill {
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-weight: 600;
    white-space: nowrap;
  }

  .qtext {
    font-size: 1.08rem;
    line-height: 1.5;
    font-weight: 600;
    margin: 0 0 18px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
  .option {
    text-align: left;
    background: #fafbfd;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    font-size: 0.96rem;
    cursor: pointer;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    line-height: 1.4;
    transition: border-color 0.12s, background 0.12s;
  }
  .option:hover:not(.locked) { border-color: var(--accent); background: #f2f5ff; }
  .option .letter {
    flex-shrink: 0;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #eceff3;
    color: var(--ink-soft);
    font-size: 0.78rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .option.correct { border-color: var(--green); background: var(--green-bg); }
  .option.correct .letter { background: var(--green); color: #fff; }
  .option.incorrect { border-color: var(--red); background: var(--red-bg); }
  .option.incorrect .letter { background: var(--red); color: #fff; }
  .option.locked { cursor: default; }
  .option.dimmed { opacity: 0.55; }

  .feedback-box {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 0.92rem;
    line-height: 1.5;
    display: none;
  }
  .feedback-box.show { display: block; }
  .feedback-box.correct-fb { background: var(--green-bg); border: 1px solid #b9e6cf; }
  .feedback-box.incorrect-fb { background: var(--red-bg); border: 1px solid #f4c6bd; }
  .feedback-verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback-verdict.correct-fb { color: var(--green); }
  .feedback-verdict.incorrect-fb { color: var(--red); }

  .nav-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .btn {
    flex: 1;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ghost {
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px solid var(--border);
    flex: 0 0 auto;
    padding: 13px 18px;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* RESULTS */
  .results-icon { font-size: 2.6rem; text-align: center; margin-bottom: 6px; }
  .results-title { text-align: center; font-size: 1.3rem; font-weight: 700; margin: 0 0 4px; }
  .results-sub { text-align: center; color: var(--ink-soft); font-size: 0.92rem; margin-bottom: 22px; }
  .score-ring-wrap { display: flex; justify-content: center; margin-bottom: 22px; }
  .score-big {
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--accent);
    text-align: center;
  }
  .score-big span { font-size: 1.2rem; color: var(--ink-soft); font-weight: 600; }
  .stat-row {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .stat-box {
    flex: 1;
    background: #fafbfd;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 10px;
    text-align: center;
  }
  .stat-box .num { font-size: 1.25rem; font-weight: 800; }
  .stat-box .lbl { font-size: 0.72rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; margin-top: 2px; }
  .stat-box.correct-num .num { color: var(--green); }
  .stat-box.incorrect-num .num { color: var(--red); }

  .review-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .review-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #fafbfd;
    border: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .review-item .rmark { flex-shrink: 0; font-weight: 800; font-size: 0.95rem; }
  .review-item.right .rmark { color: var(--green); }
  .review-item.wrong .rmark { color: var(--red); }
  .review-item .rtext { color: var(--ink-soft); line-height: 1.4; }

  .footer-note {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.78rem;
    margin-top: 22px;
  }

  @media (max-width: 420px) {
    .card { padding: 16px; }
    .qtext { font-size: 1rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>INT335 — CA Practice</h1>
    <p>Foundations of Design Thinking · Empathy &amp; Observation</p>
  </header>

  <div class="card" id="app"></div>

  <div class="footer-note" id="footerNote"></div>
</div>

<script>
const DATA = {"unit1": [{"q": "A student spends two hours in deep focus solving a tricky circuit problem, gets nowhere, then goes for a walk and the answer suddenly appears. Which concept from Unit 1 best explains this?", "options": ["The candle problem", "Alternating focused and diffuse modes", "The VARK framework", "Functional fixedness"], "answer": 1, "explanation": "The notes describe the practical rule that effective problem-solving alternates focused and diffuse modes \u2014 struggle first (focused), then step away so the diffuse mode can reorganise the material, as in the Mendeleev example."}, {"q": "Mendeleev is said to have arranged the periodic table after dreaming about it. According to the Unit 1 notes, what is the key lesson from this story?", "options": ["Dreams are a reliable source of scientific discovery", "Diffuse mode does not work on an empty mind \u2014 struggle first, then step away", "Focused mode is always superior to diffuse mode", "Creativity requires sleep deprivation"], "answer": 1, "explanation": "The notes explicitly state the diffuse mode reorganises material you have already struggled with in focused mode; it doesn't work on an empty mind."}, {"q": "A trainer tells learners: 'You're a Visual learner, so I'll only ever teach you using diagrams from now on, and you'll learn best.' Based on the 'Note on Evidence' slide, what is wrong with this claim?", "options": ["VARK does not include a Visual category", "Controlled studies have not supported the claim that matching teaching style to preferred style improves results", "Visual learners actually perform worse than others", "The VARK model has been officially withdrawn from use"], "answer": 1, "explanation": "The notes say the stronger claim \u2014 that being taught in your preferred style improves results \u2014 has repeatedly failed to hold up in controlled studies, even though VARK remains a useful self-reflection prompt."}, {"q": "In Activity 1.2, a student scores statements 1 and 5 together. Which VARK style does this pairing represent?", "options": ["Auditory", "Reading/Writing", "Visual", "Kinesthetic"], "answer": 2, "explanation": "The scoring key pairs V = statements 1+5, A = 2+6, R = 3+7, K = 4+8."}, {"q": "Three study strategies are said to actually replicate in research, unlike the strict VARK-matching claim. Which set is it?", "options": ["Retrieval practice, spacing, and interleaving", "Visual aids, note-taking, and group study", "Cramming, rereading, and highlighting", "Lecture attendance, memorisation, and repetition"], "answer": 0, "explanation": "The notes list retrieval practice, spacing, and interleaving as the three study strategies that do replicate."}, {"q": "A team is asked to find non-obvious uses for a paper clip during the 'Mystery Bag' activity. Struggling to think beyond 'holding papers together' is an example of which cognitive barrier?", "options": ["Conformity", "Fear of failure", "Functional fixedness", "The expertise trap"], "answer": 2, "explanation": "Functional fixedness is the tendency to see objects only for their traditional purpose, exactly as illustrated by the paper clip example."}, {"q": "In the plastic bucket worked example, students who list six or seven uses and then stall are advised to change their approach. What technique unlocks more ideas?", "options": ["Ask a friend for ideas", "List the object's properties first, then find a use for each property", "Look up bucket uses online", "Only consider the bucket's original manufacturing purpose"], "answer": 1, "explanation": "The technique is to stop thinking about the object and start listing its properties (hollow, watertight, rigid, etc.), then derive uses from each property \u2014 this produced 28 uses from 6 properties."}, {"q": "An engineer with 15 years of experience keeps proposing the same solution pattern for every new problem, even when it doesn't quite fit. Which cognitive block is this closest to?", "options": ["Premature judgment", "The expertise trap", "Conformity", "Fear of failure"], "answer": 1, "explanation": "The expertise trap is over-reliance on past solutions \u2014 the more you know, the more you reach for what worked before."}, {"q": "During a brainstorming session, a junior team member rejects her own idea internally before even saying it aloud, worried others will laugh. This illustrates which cognitive block?", "options": ["The expertise trap", "Fear of failure", "Premature judgment", "Conformity"], "answer": 1, "explanation": "Fear of failure is the hesitation to propose ideas due to fear of criticism, which matches the scenario of self-censoring before speaking."}, {"q": "A student imagines a drone delivery system in detail but never builds or launches it. According to the 'Three Concepts, Often Confused' table, this is best classified as:", "options": ["Invention", "Innovation", "Creativity", "Disruption"], "answer": 2, "explanation": "Creativity is the ability to generate original and useful ideas \u2014 the table's own example for creativity is 'imagining a drone delivery system.'"}, {"q": "Alexander Graham Bell created the first telephone \u2014 something that did not exist before. Which concept does this exemplify?", "options": ["Innovation", "Invention", "Incremental improvement", "Disruption"], "answer": 1, "explanation": "Invention is creating something entirely new that did not exist before; the notes cite the first telephone by A. G. Bell as the example."}, {"q": "The iPhone is described as 'reshaping the smartphone market.' Which of the three concepts (creativity, invention, innovation) does this represent, and why?", "options": ["Invention, because it was the first phone ever made", "Innovation, because it successfully implemented creative ideas to create value at scale", "Creativity, because it was an original idea", "None of the three \u2014 it is simply good marketing"], "answer": 1, "explanation": "Innovation is successfully implementing creative ideas to create value; the notes state creativity becomes innovation only when it delivers value, matching the iPhone example given."}, {"q": "USB transitioning to USB Type-C is used as an example of which type of change?", "options": ["Disruptive innovation", "Incremental invention", "Wicked problem resolution", "Functional fixedness"], "answer": 1, "explanation": "USB \u2192 USB Type-C is listed under Incremental Invention \u2014 small but meaningful improvements to an existing product."}, {"q": "Netflix replacing DVD rental stores is given as an example of which concept?", "options": ["Incremental invention", "Disruptive innovation", "Functional fixedness", "Conformity"], "answer": 1, "explanation": "The Disruptor/What it replaced table lists Netflix replacing DVD rental stores under Disruptive Innovation \u2014 a new model that transforms markets."}, {"q": "A city is trying to solve homelessness \u2014 an issue with no single right answer, many interdependent causes, and solutions that can only be judged 'better or worse.' What kind of problem is this?", "options": ["Well-defined problem", "Ill-defined problem", "Wicked problem", "Technical problem"], "answer": 2, "explanation": "Wicked problems are complex and interconnected, judged as better or worse rather than right or wrong \u2014 the notes give climate, poverty, and healthcare as examples, matching homelessness."}, {"q": "Solving a quadratic equation has one correct answer and clear constraints. What category of problem is this, per the Unit 1 framework?", "options": ["Wicked problem", "Ill-defined problem", "Well-defined problem", "Diffuse problem"], "answer": 2, "explanation": "Well-defined problems have clear goals, constraints, and a solution, with equations given as an explicit example."}, {"q": "Designing a new marketing strategy has unclear goals and many possible solution paths, but is not as deeply interconnected as a societal crisis. This is classified as:", "options": ["A well-defined problem", "A wicked problem", "An ill-defined problem", "A focused-mode problem"], "answer": 2, "explanation": "The notes list 'marketing strategy' explicitly under Ill-Defined problems: unclear goals or paths with many possible solutions."}, {"q": "Herbert Simon's contribution in the 1969\u201370s, as shown on the Design Thinking history timeline, was to frame design as:", "options": ["A wicked problem", "A way of thinking", "A five-stage process", "A human-centred design lens"], "answer": 1, "explanation": "The timeline credits Herbert Simon (1969\u201370s) with framing 'design as a way of thinking.'"}, {"q": "According to Lawson's Experiment cited in the history timeline, what is the key behavioural difference between scientists and designers when solving problems?", "options": ["Scientists test rapidly while designers analyse first", "Scientists are problem-focused and analyse thoroughly before proposing solutions; designers are solution-focused and test many solutions rapidly through iteration", "There is no meaningful difference between the two groups", "Designers never analyse a problem before solving it"], "answer": 1, "explanation": "The notes state scientists are problem-focused (analyse thoroughly before proposing solutions) while designers are solution-focused (create and test many solutions rapidly, learning through iteration)."}, {"q": "A team follows Empathize \u2192 Define \u2192 Ideate \u2192 Prototype \u2192 Test, then loops back to Empathize after testing reveals a wrong assumption. Which framework are they using, and what does the dashed feedback arrow represent?", "options": ["The IDEO framework; it shows feasibility feeding into viability", "The Stanford d.school framework; testing feeds back into empathy, since the process is iterative not linear", "The AEIOU framework; it shows activities feeding into environment", "The Waterfall model; it shows testing feeding into shipping"], "answer": 1, "explanation": "This is the Stanford d.school's five-stage framework; the notes explicitly say 'the dashed arrow is the whole point: testing feeds back into empathy. The process is iterative, not linear.'"}, {"q": "A concept is technically feasible and economically viable, but nobody actually wants it. Using the IDEO Human-Centred Design lens, which condition is missing, and what is the likely outcome?", "options": ["Viability is missing, so the product will be economically unsustainable", "Feasibility is missing, so the product cannot be built", "Desirability is missing, so the concept will fail in practice despite meeting the other two conditions", "Nothing is missing \u2014 meeting two of three lenses is sufficient for genuine innovation"], "answer": 2, "explanation": "The IDEO framework requires all three lenses (Desirability, Feasibility, Viability) to overlap; meeting only one or two produces a concept that fails in practice \u2014 here, desirability (do people want this?) is missing."}, {"q": "A software company finishes requirements gathering, then design, then development, then testing \u2014 strictly in that order, with user feedback only collected at the very end. Which model does this describe, and what is its key weakness according to the notes?", "options": ["Human-Centred Design; its weakness is excessive iteration", "Waterfall; user feedback comes at the end, so changes are costly", "The d.school framework; its weakness is that it lacks a testing phase", "Agile; its weakness is unclear requirements"], "answer": 1, "explanation": "This is the Waterfall model \u2014 linear, step-by-step, with each phase finished before the next; the notes state feedback comes at the end, so changes are costly, contrasted with HCD's iterative loop."}, {"q": "Airbnb's early data showed low bookings and flat revenue, but the numbers alone didn't explain why. What did the founders do to uncover the real problem, and what did they find?", "options": ["They ran a large-scale online survey and found pricing was too high", "They flew to visit hosts personally, discovering listings had poor-quality amateur photographs that discouraged bookings", "They hired a marketing agency to redesign the logo", "They lowered prices across all listings without further investigation"], "answer": 1, "explanation": "The case study describes the founders personally visiting hosts in New York and discovering poor-quality photos were discouraging bookings \u2014 an empathy-driven insight the data alone couldn't reveal."}, {"q": "What was the actual intervention Airbnb's founders used to fix the booking problem, and why is it described as significant despite being simple?", "options": ["They built an AI photo-enhancement tool; it was significant because it was highly scalable", "They rented a camera and photographed listings themselves; it is called out as an intervention that does not scale, which is exactly why nobody had tried it", "They offered cash refunds to hosts; it was significant because it solved the problem instantly", "They removed low-quality listings from the platform; it was significant because it improved average ratings"], "answer": 1, "explanation": "The notes state they rented a camera and photographed the listings themselves, calling it 'a simple, empathy-driven intervention \u2014 and one that does not scale, which is exactly why nobody had tried it.'"}, {"q": "Google Glass (2013) had cutting-edge technology but failed commercially. According to the case study, which of the following was NOT listed as a reason for its failure?", "options": ["Social concerns about being recorded", "An awkward design that drew unwanted attention", "A hardware defect that caused frequent crashes", "No clear use case and a high price of $1,500"], "answer": 2, "explanation": "The listed reasons were social concerns, awkward design, no clear use case, and price \u2014 a hardware defect/crashing issue is not mentioned anywhere in the case study."}, {"q": "Google later relaunched Glass as the 'Enterprise Edition' for warehouse and factory technicians, and it succeeded in that context. What broader lesson does the case study draw from this?", "options": ["Wearable technology never succeeds in consumer markets", "A product is never simply good or bad in the abstract \u2014 it is good or bad for someone, depending on user desirability", "Price is the only factor that determines product success", "Enterprise customers always have lower expectations than consumers"], "answer": 1, "explanation": "The notes conclude: 'A product is never simply good or bad \u2014 it is good or bad for someone,' using the Enterprise Edition's success with a different user group as evidence."}, {"q": "Dr. V founded Aravind Eye Hospital after realising cataract surgery already existed and worked medically. What did he identify as the actual problem?", "options": ["A shortage of trained surgeons worldwide", "Access \u2014 surgery cost more than most rural patients earned in months, hospitals were far, and surgeons were scarce", "Poor quality of the surgical technique itself", "Lack of government funding for healthcare"], "answer": 1, "explanation": "The case study states the problem was not medical \u2014 cataract surgery worked \u2014 but access: cost, distance, and scarcity of surgeons for rural patients."}, {"q": "Dr. V reframed his challenge by asking how McDonald's serves millions of people the same product, consistently, cheaply, anywhere. What design technique does the case study say this exemplifies, to be practised further in Unit 3?", "options": ["Functional fixedness reduction", "Analogous inspiration \u2014 drawing on a completely unrelated industry", "The Five Whys technique", "The AEIOU observation framework"], "answer": 1, "explanation": "The notes explicitly call this 'an example of analogous inspiration, a technique you will practise in Unit 3' \u2014 studying the fast-food assembly line as a design reference."}, {"q": "At Aravind Eye Care, paying patients choose a higher comfort tier, but free and paying patients receive the same surgeons and the same quality of surgery. Which principle from the 'Lessons Learned' does this best illustrate?", "options": ["Affordability can be designed \u2014 it is an outcome of process, not only of subsidy", "Dignity is a design requirement \u2014 only the comfort tier differs, not the quality of care", "The best analogy often comes from a completely unrelated industry", "Cross-subsidy pricing is unnecessary for financial sustainability"], "answer": 1, "explanation": "The notes state 'Dignity is a design requirement. Free patients receive the same surgery and the same surgeons as paying ones. Only the comfort tier differs' \u2014 directly matching the scenario."}, {"q": "In 'Spot the Mistake 1.1', a team decides to build an attendance app first, and only afterward surveys students to find out which features they want in it. What is the giveaway that this is NOT genuine Design Thinking?", "options": ["Surveys are never a valid research method in Design Thinking", "The solution (an app) was decided before any user research was done, reversing the empathize-first order", "Attendance apps are inherently poor product ideas", "The team should have interviewed faculty instead of students"], "answer": 1, "explanation": "This matches the 'ordinary engineering wearing a Design Thinking label' pattern \u2014 the solution was chosen before empathizing with users, when Design Thinking should begin with understanding needs before proposing solutions."}, {"q": "In the same 'Spot the Mistake 1.1' set, a team's first three prototypes were rejected by users, so they changed the problem statement. Why does this represent genuine Design Thinking?", "options": ["Because they kept the same prototype and just changed the marketing", "Because user feedback (testing) fed back into redefining the problem, reflecting the iterative empathize-test loop", "Because three prototypes is the correct number required by the process", "Because changing the problem statement guarantees success"], "answer": 1, "explanation": "This reflects the iterative nature of Design Thinking \u2014 test results looping back to redefine the problem \u2014 consistent with the d.school framework's iterative arrow described earlier in the unit."}], "unit2": [{"q": "A teacher assumes students are 'just not interested' in online learning, rather than investigating why they struggle. What does the Unit 2 material say is missing from this teacher's approach?", "options": ["Sympathy", "Empathy \u2014 seeing the world from the user's (student's) point of view instead of assuming", "Computational empathy", "Quantitative research"], "answer": 1, "explanation": "The notes use exactly this example: 'A teacher understanding why students struggle with online learning \u2014 rather than assuming they are simply not interested' as the model of empathy in practice."}, {"q": "A colleague says, 'Poor first-years, getting lost on campus must be awful,' but does nothing further. According to the Sympathy/Empathy/Compassion table, this statement reflects:", "options": ["Compassion, because it shows care", "Empathy, because it names a specific problem", "Sympathy, because it feels for someone from a distance without action", "Computational empathy, because it involves a system"], "answer": 2, "explanation": "The table defines Sympathy as 'feeling for someone, from a distance,' with the example line 'Poor first-years, getting lost must be awful' given verbatim as the sympathy example."}, {"q": "A team follows three first-years for a morning and discovers the block numbering resets in each wing, then decides to renumber the wing signage that same week. According to the table, this progression demonstrates:", "options": ["Sympathy only", "Empathy only, without further action", "Compassion \u2014 empathy plus the decision to act", "Computational empathy"], "answer": 2, "explanation": "The table defines Compassion as 'empathy plus the decision to act,' with the exact example: observing t const UNIT_META = {
  unit1: { title: "Unit 1", sub: "Foundations of Learning, Creativity &amp; Design Thinking" },
  unit2: { title: "Unit 2", sub: "Empathy, Observation &amp; Problem Identification" }
};

let state = {
  screen: 'menu',
  unitKey: null,
  order: [],
  idx: 0,
  selected: null,
  locked: false,
  correctCount: 0,
  answers: [] // {correct: bool}
};

const app = document.getElementById('app');
const footerNote = document.getElementById('footerNote');

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderMenu() {
  footerNote.textContent = 'INT335 · Continuous Assessment practice · scenario-based MCQs';
  let html = '';
  html += '<div class="menu-section"><h2>Choose what to practice</h2>';

  const totalAll = DATA.unit1.length + DATA.unit2.length;
  html += `<button class="unit-btn" onclick="startQuiz('all')">
    <div><div>All Questions (Full Mock)</div><div class="meta">${totalAll} questions · both units mixed</div></div>
    <span class="arrow">›</span>
  </button>`;

  for (const key of ['unit1', 'unit2']) {
    const meta = UNIT_META[key];
    const count = DATA[key].length;
    html += `<button class="unit-btn" onclick="startQuiz('${key}')">
      <div><div>${meta.title}</div><div class="meta">${meta.sub} · ${count} questions</div></div>
      <span class="arrow">›</span>
    </button>`;
  }
  html += '</div>';
  app.innerHTML = html;
}

function startQuiz(key) {
  let pool;
  if (key === 'all') {
    pool = DATA.unit1.map(q => ({...q, unit: 'Unit 1'})).concat(DATA.unit2.map(q => ({...q, unit: 'Unit 2'})));
  } else {
    pool = DATA[key].map(q => ({...q, unit: UNIT_META[key].title}));
  }
  state = {
    screen: 'quiz',
    unitKey: key,
    pool: pool,
    order: shuffle([...Array(pool.length).keys()]),
    idx: 0,
    selected: null,
    locked: false,
    correctCount: 0,
    answers: []
  };
  renderQuiz();
}

function currentQuestion() {
  return state.pool[state.order[state.idx]];
}

function renderQuiz() {
  const q = currentQuestion();
  const total = state.order.length;
  const num = state.idx + 1;
  const pct = Math.round(((state.idx) / total) * 100);

  footerNote.textContent = `Question ${num} of ${total}`;

  let optsHtml = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    let cls = 'option';
    if (state.locked) {
      cls += ' locked';
      if (i === q.answer) cls += ' correct';
      else if (i === state.selected) cls += ' incorrect';
      else cls += ' dimmed';
    }
    optsHtml += `<button class="${cls}" onclick="selectOption(${i})" ${state.locked ? 'disabled' : ''}>
      <span class="letter">${letters[i]}</span>
      <span>${opt}</span>
    </button>`;
  });

  let feedbackHtml = '';
  if (state.locked) {
    const isCorrect = state.selected === q.answer;
    feedbackHtml = `<div class="feedback-box show ${isCorrect ? 'correct-fb' : 'incorrect-fb'}">
      <div class="feedback-verdict ${isCorrect ? 'correct-fb' : 'incorrect-fb'}">${isCorrect ? '✓ Correct' : '✗ Not quite'}</div>
      ${q.explanation}
    </div>`;
  }

  const isLast = state.idx === total - 1;
  const nextLabel = state.locked ? (isLast ? 'See Results' : 'Next Question →') : 'Submit Answer';

  app.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">${num}/${total}</div>
    </div>
    <div class="qtop">
      <span class="qtag">${q.unit}</span>
      <span class="score-pill">Score: ${state.correctCount}/${state.answers.length}</span>
    </div>
    <p class="qtext">${q.q}</p>
    <div class="options">${optsHtml}</div>
    ${feedbackHtml}
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="backToMenu()">Exit</button>
      <button class="btn btn-primary" id="nextBtn" ${state.selected === null ? 'disabled' : ''} onclick="handleNext()">${nextLabel}</button>
    </div>
  `;
}

function selectOption(i) {
  if (state.locked) return;
  state.selected = i;
  renderQuiz();
}

function handleNext() {
  if (state.selected === null) return;
  if (!state.locked) {
    state.locked = true;
    const q = currentQuestion();
    const correct = state.selected === q.answer;
    if (correct) state.correctCount++;
    state.answers.push({ correct, q: q.q });
    renderQuiz();
    return;
  }
  // move to next
  if (state.idx < state.order.length - 1) {
    state.idx++;
    state.selected = null;
    state.locked = false;
    renderQuiz();
  } else {
    renderResults();
  }
}

function backToMenu() {
  state.screen = 'menu';
  renderMenu();
}

function renderResults() {
  const total = state.answers.length;
  const correct = state.correctCount;
  const pct = Math.round((correct / total) * 100);
  footerNote.textContent = 'Practice complete';

  let icon = '📘';
  let title = 'Keep practicing';
  if (pct >= 85) { icon = '🏆'; title = 'Excellent work!'; }
  else if (pct >= 70) { icon = '✅'; title = 'Good grasp!'; }
  else if (pct >= 50) { icon = '📝'; title = 'Getting there'; }

  let reviewHtml = '';
  state.answers.forEach((a, i) => {
    reviewHtml += `<div class="review-item ${a.correct ? 'right' : 'wrong'}">
      <span class="rmark">${a.correct ? '✓' : '✗'}</span>
      <span class="rtext">Q${i + 1}. ${a.q}</span>
    </div>`;
  });

  app.innerHTML = `
    <div class="results-icon">${icon}</div>
    <div class="results-title">${title}</div>
    <div class="results-sub">${UNIT_META[state.unitKey] ? UNIT_META[state.unitKey].title : 'Full Mock'} · ${total} questions</div>
    <div class="score-ring-wrap">
      <div class="score-big">${correct}<span>/${total}</span></div>
    </div>
    <div class="stat-row">
      <div class="stat-box correct-num"><div class="num">${correct}</div><div class="lbl">Correct</div></div>
      <div class="stat-box incorrect-num"><div class="num">${total - correct}</div><div class="lbl">Incorrect</div></div>
      <div class="stat-box"><div class="num">${pct}%</div><div class="lbl">Score</div></div>
    </div>
    <h2 style="font-size:0.78rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin:0 0 10px;font-weight:700;">Review</h2>
    <div class="review-list">${reviewHtml}</div>
