<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>INT335 Midterm — 150 MCQ Practice</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2933;--mut:#617080;--line:#dde2e8;--acc:#2c3e50;--teal:#16a085;--ok:#1e8e5a;--okbg:#e6f5ed;--bad:#c0392b;--badbg:#fdecea;--amber:#f39c12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--acc);color:#fff;padding:18px 20px}
header h1{margin:0;font-size:1.25rem}header p{margin:4px 0 0;color:#c9d3dc;font-size:.9rem}
main{max-width:820px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.unit h2{margin:0 0 4px;font-size:1.05rem;color:var(--acc)}
.unit .meta{color:var(--mut);font-size:.85rem;margin-bottom:10px}
.topic{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.topic label{flex:1;cursor:pointer}.topic span.n{color:var(--mut);font-size:.85rem}
.allrow{font-weight:600}
button{font:inherit;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.primary{background:var(--teal);color:#fff;font-weight:600}.primary:disabled{background:#b7c4c0;cursor:not-allowed}
.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.opt-line{display:flex;gap:16px;margin:10px 0;color:var(--mut);font-size:.9rem;flex-wrap:wrap}
.bar{height:6px;background:#e5e9ee;border-radius:4px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--teal);width:0}
.tag{display:inline-block;font-size:.75rem;background:#eaf1f6;color:var(--acc);border-radius:20px;padding:2px 10px;margin-right:6px}
.case{background:#f2f6f9;border-left:4px solid var(--amber);padding:12px 14px;border-radius:6px;margin:12px 0}
.case b{display:block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:#a56a00;margin-bottom:4px}
.q{font-weight:600;margin:12px 0}
.o{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);margin:8px 0;padding:11px 14px;border-radius:10px}
.o:hover:not(:disabled){border-color:var(--teal)}
.o .l{font-weight:700;color:var(--mut);min-width:1.4em}
.o.ok{background:var(--okbg);border-color:var(--ok)}.o.bad{background:var(--badbg);border-color:var(--bad)}
.o:disabled{cursor:default;color:inherit}
.expl{margin-top:12px;padding:12px 14px;border-radius:8px;background:#f2f6f9;display:none}
.expl.show{display:block}.expl strong.r{color:var(--ok)}.expl strong.w{color:var(--bad)}
.score{font-size:2.4rem;font-weight:700;color:var(--acc)}
.hidden{display:none}
.sub textarea{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.model{white-space:pre-wrap;margin-top:12px;padding:12px 14px;border-radius:8px;background:#eef7f3;border-left:4px solid var(--teal)}
.tag.t{background:#fff3d6;color:#8a5a00}
@media(max-width:520px){main{padding:14px 10px 50px}.card{padding:14px}}
</style></head><body>

<main>
<section id="menu">
 <div class="card"><div class="row"><button class="ghost" id="selAll">Select all topics</button><button class="ghost" id="selNone">Clear</button><span style="color:var(--mut)" id="selCount"></span></div>

 </div>

</div></section>
</main>
<script>
const QS=[{"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "Meera, a third-year B.Tech student, spends three days on a circuit-design problem for her mini-project, trying every method she knows without success. A friend advises her to go for a long walk and stop thinking about it. The next morning, while brushing her teeth, a workable approach suddenly occurs to her.", "q": "Which explanation best fits what happened?", "opts": ["Her diffuse mode reorganised material she had already struggled with in focused mode and produced a connection.", "The walk switched her learning style from Visual to Kinesthetic, which solved the problem.", "Her focused mode kept running unchanged during the walk and simply finished the calculation.", "Diffuse mode works best on an empty mind, so her three days of effort were unnecessary."], "expl": "The diffuse mode does not work on an empty mind; it reorganises material you have already struggled with. Rule: struggle first (focused), then step away (diffuse).", "type": "mcq", "id": 1, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "Two students have ten days to solve an open design challenge. Arjun reads the brief once on Day 1 and then does nothing for nine days, saying his 'subconscious will work on it'. Neel works intensively for two days, then alternates between short breaks and further work.", "q": "Who is more likely to reach a creative breakthrough, and why?", "opts": ["Neel, because diffuse processing needs material previously wrestled with in focused mode, and effective problem-solving alternates the two modes.", "Arjun, because a longer rest gives the diffuse mode more time to build broad connections.", "Both equally, because switching between modes is random and unrelated to study habits.", "Neither, because creative breakthroughs depend only on learning style and not on thinking modes."], "expl": "Arjun gave the diffuse mode nothing to reorganise. Neel struggled first and then stepped away, which is exactly the alternation the notes recommend.", "type": "mcq", "id": 2, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "A team lead at a software firm must (i) trace a known bug line by line through an established debugging procedure, and (ii) later come up with an unconventional concept for a new feature.", "q": "Which thinking modes best suit tasks (i) and (ii)?", "opts": ["(i) Focused mode; (ii) Diffuse mode", "Both focused, because engineering work is logical", "Both diffuse, because both tasks involve problem-solving", "(i) Diffuse mode; (ii) Focused mode"], "expl": "Focused mode = concentrated attention using established pathways (procedures, code, analysis). Diffuse mode = relaxed, associative thinking that makes broader connections (brainstorming, innovative design).", "type": "mcq", "id": 3, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "", "q": "Which statement about the diffuse mode is correct?", "opts": ["It works best on a problem you have never thought about before", "It follows established neural pathways to carry out procedures step by step", "It is the mode used for solving equations and writing code", "It makes broader connections among ideas and is linked to brainstorming and innovative design"], "expl": "Diffuse mode = relaxed, associative thinking that makes broader connections. Focused mode handles equations, code, data and procedures.", "type": "mcq", "id": 4, "ans": 3}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "A writer has spent hours drafting and is stuck on how to resolve her plot.", "q": "According to the course notes, what is the best next move?", "opts": ["Delete the whole draft so the mind is empty", "Take a break such as a walk so diffuse processing can work, then return", "Keep forcing focused effort without any break", "Ask friends to judge every line immediately"], "expl": "When stuck, take a break to allow diffuse processing. The most effective problem-solving alternates between focused and diffuse modes.", "type": "mcq", "id": 5, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "", "q": "Which option correctly contrasts the focused and diffuse thinking modes?", "opts": ["Focused: used for brainstorming; Diffuse: used for solving equations", "Focused: concentrated, analytical, uses established pathways; Diffuse: relaxed, associative, makes broader connections", "Focused: relaxed and associative; Diffuse: concentrated and procedural", "They are the same mode used at different times of day"], "expl": "Focused = logical, structured, sequential (equations, code, procedures). Diffuse = creative, exploratory, flexible (brainstorming, innovative design). Effective problem-solving alternates between the two.", "theory": true, "type": "mcq", "id": 6, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Thinking Modes", "case": "A student starts a hard design assignment the night before the deadline and plans to 'sleep on it and let the subconscious solve it'.", "q": "What is wrong with this plan?", "opts": ["Sleep never helps problem-solving", "Diffuse mode reorganises material already struggled with; with no earlier focused effort there is nothing to reorganise, and no time to alternate", "Focused mode must keep running through the night", "He should avoid the assignment until the deadline"], "expl": "Struggle first, then step away. A better schedule: start early, work in focused mode, take a break, return, repeat.", "theory": true, "type": "mcq", "id": 7, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Learning Styles (VARK)", "case": "A college announces that after a VARK questionnaire every student will be taught only in their preferred style, claiming this 'guarantees higher marks'. A Design Thinking student is asked to comment.", "q": "Which critique is most consistent with the course notes?", "opts": ["The claim is well supported by controlled studies, so the policy is correct.", "VARK is a useful prompt for self-reflection, but the claim that teaching in the preferred style improves results has repeatedly failed in controlled studies.", "VARK is useless even for reflection, so students should avoid thinking about how they study.", "The research is irrelevant because any idea that becomes popular must be evidence-backed."], "expl": "Treat a VARK result as a nudge toward self-awareness, not a rule. The notes also stress that an idea can be hugely popular without research support, and that retrieval practice, spacing and interleaving are the strategies that do replicate.", "type": "mcq", "id": 8, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Learning Styles (VARK)", "case": "Using Activity 1.2 scoring (V = statements 1+5, A = 2+6, R = 3+7, K = 4+8), a student rates statements 1 to 8 as 2, 4, 5, 1, 3, 2, 4, 3 respectively.", "q": "Which VARK letter scores highest?", "opts": ["V (Visual)", "R (Reading/Writing)", "A (Auditory)", "K (Kinesthetic)"], "expl": "V = 2+3 = 5; A = 4+2 = 6; R = 5+4 = 9; K = 1+3 = 4. R is highest. (Remember this is a reflection prompt, not a rule for how you must study.)", "type": "mcq", "id": 9, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Learning Styles (VARK)", "case": "", "q": "In the VARK model, what does 'K' stand for and prefer?", "opts": ["Key-learning: discussion and debate", "Kinesthetic: practical, hands-on experience", "Knowledge: textbooks and written notes", "Kinetic: watching videos and animations"], "expl": "V = Visual, A = Auditory, R = Reading/Writing, K = Kinesthetic (practical, hands-on experience).", "type": "mcq", "id": 10, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Learning Styles (VARK)", "case": "", "q": "Which statement about VARK matches the course notes?", "opts": ["It is strongly proven, so students should be taught only in their preferred style", "Spacing and interleaving have failed controlled studies, while VARK has replicated", "It is a validated measure of intelligence", "It is a useful prompt for reflecting on how you study, but the claim that preferred-style teaching improves results has failed in controlled studies; retrieval practice, spacing and interleaving do replicate"], "expl": "Treat VARK as a nudge toward self-awareness, not a rule. A popular idea can lack research support.", "theory": true, "type": "mcq", "id": 11, "ans": 3}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "During a hackathon, a team needs a lightweight stand to hold a sensor above a table. Someone points at an empty cardboard tube from a kitchen roll and says, 'That's just rubbish.' Another member says, 'Hold on — it is hollow, light, rigid and cylindrical,' and uses it as the stand.", "q": "Which technique did the second member use to overcome functional fixedness?", "opts": ["Rejecting ideas early so the team could converge faster", "Surveying users on how much they like cardboard tubes", "Listing the object's properties and finding a use for each, rather than thinking of its usual purpose", "Following the team's conventional thinking in order to fit in"], "expl": "Functional fixedness is seeing objects only for their conventional purpose. The way out is to stop thinking about the object and start listing its properties, then find a use for each property.", "type": "mcq", "id": 12, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "A senior engineer with twenty years' experience is given a new thermal problem. Without studying how it differs from earlier ones, he proposes the same heat-sink-based solution he used in his last six projects.", "q": "Which cognitive block is most clearly at work?", "opts": ["Premature judgment", "The expertise trap", "Fear of failure", "Conformity"], "expl": "The expertise trap is over-reliance on past solutions: the more you know, the more you reach for what worked before.", "type": "mcq", "id": 13, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "In a class brainstorm, Sana has an unusual idea but stays silent because a classmate laughed at her suggestion last week. Meanwhile the other five students keep repeating variations of the first idea that was spoken.", "q": "Which cognitive blocks are most evident for Sana and for the others, respectively?", "opts": ["Fear of failure (criticism); conformity", "Expertise trap; premature judgment", "Conformity; fear of failure", "Premature judgment; expertise trap"], "expl": "Sana hesitates because she fears criticism (fear of failure). The others follow the conventional, already-spoken line of thought to fit in (conformity).", "type": "mcq", "id": 14, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "", "q": "Functional fixedness is best defined as:", "opts": ["Rejecting ideas before exploring them fully", "The tendency to see objects only for their traditional purpose, limiting creative problem-solving", "Over-reliance on past solutions by experienced people", "Hesitation to propose ideas because of fear of criticism"], "expl": "The other options define fear of failure, premature judgment and the expertise trap respectively.", "type": "mcq", "id": 15, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "A mechanic needs to seal a leaking pipe. A discarded cycle inner tube lies nearby, but he sees it only as 'a tube for tyres' and goes to buy a rubber seal.", "q": "Which concept explains his behaviour?", "opts": ["Premature judgment", "Conformity", "Fear of failure", "Functional fixedness"], "expl": "He sees the object only for its conventional purpose, although a cut piece of the tube would serve as a seal.", "type": "mcq", "id": 16, "ans": 3}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "During a design review, a manager rejects each suggestion within seconds, before the team has explored how it might work.", "q": "Which cognitive block does this show?", "opts": ["Conformity", "Premature judgment", "The expertise trap", "Functional fixedness"], "expl": "Premature judgment is rejecting ideas before exploring them fully. It is also why judgment must be deferred during ideation.", "type": "mcq", "id": 17, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "", "q": "According to the notes, Design Thinking helps break cognitive blocks through:", "opts": ["Keeping users out of the process to avoid bias", "Empathy, experimentation, collaboration and structured creative problem-solving", "Finishing each phase completely before starting the next", "Strict reuse of previously successful solutions"], "expl": "DT links directly to the blocks: empathy challenges assumptions, experimentation reduces fear of failure, and collaboration widens perspectives.", "type": "mcq", "id": 18, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "", "q": "Which use of the property-listing technique on an old CD is correct?", "opts": ["It plays music, so it can only be used as a music disc", "Reflective surface suggests a signal mirror or bird scarer; central hole suggests a hanging decoration", "List its price and brand, then discard it", "List synonyms for the word 'CD' and choose one"], "expl": "Stop thinking about the object and list its properties, then find a use for each property.", "theory": true, "type": "mcq", "id": 19, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Functional Fixedness & Cognitive Blocks", "case": "Match four situations: (i) staying silent for fear of being laughed at; (ii) everyone repeating the first idea spoken; (iii) dismissing an idea instantly; (iv) reusing last project's design for a new problem.", "q": "Which matching of block to situation is correct?", "opts": ["(i) premature judgment; (ii) expertise trap; (iii) fear of failure; (iv) conformity", "(i) expertise trap; (ii) premature judgment; (iii) conformity; (iv) fear of failure", "(i) fear of failure; (ii) conformity; (iii) premature judgment; (iv) expertise trap", "(i) conformity; (ii) fear of failure; (iii) expertise trap; (iv) premature judgment"], "expl": "DT overcomes these blocks through empathy, experimentation, collaboration and structured creative problem-solving.", "theory": true, "type": "mcq", "id": 20, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "A university lab builds the first working prototype of a battery chemistry that has never existed before, but no company has adopted it. Separately, a start-up takes ordinary existing batteries and builds a battery-swap service for e-rickshaw drivers that thousands use daily.", "q": "How should the two be classified according to the course?", "opts": ["Lab: creativity only; start-up: invention", "Both are inventions, since both involve batteries", "Lab: invention; start-up: innovation", "Lab: innovation; start-up: invention"], "expl": "Invention = creating something entirely new. Innovation = successfully implementing ideas to create value. Creativity becomes innovation only when it delivers value.", "type": "mcq", "id": 21, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "A local tiffin service adds a mobile app for ordering its existing meals. A new firm, with no restaurants, launches shared cloud kitchens that deliver office meals at half the price to people who previously could not afford regular ordering.", "q": "Which classification is most accurate?", "opts": ["The app is a disruptive innovation; the cloud-kitchen firm is an incremental improvement", "The app is an incremental improvement; the cloud-kitchen firm is a disruptive innovation", "Both are disruptive because both use technology", "Both are incremental because both sell meals"], "expl": "Incremental = small but meaningful improvements to an existing product or process. Disruptive = a new product, service or business model that transforms markets with simpler, cheaper or more accessible solutions and serves unmet needs.", "type": "mcq", "id": 22, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "", "q": "Which option correctly defines all three terms?", "opts": ["Creativity, invention and innovation are three words for the same thing", "Creativity: implementing ideas for value; Invention: generating ideas; Innovation: creating something new", "Creativity: creating something entirely new; Invention: generating original ideas; Innovation: improving cost", "Creativity: generating original and useful ideas; Invention: creating something entirely new; Innovation: successfully implementing ideas to create value"], "expl": "Creativity becomes innovation only when it delivers value.", "type": "mcq", "id": 23, "ans": 3}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "A phone maker's new model has a slightly better battery and camera than last year's model.", "q": "How is this best described?", "opts": ["A wicked problem", "Disruptive innovation", "Incremental invention", "Invention of an entirely new category"], "expl": "Incremental invention means small but meaningful improvements to an existing product or process.", "type": "mcq", "id": 24, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "A firm launches a simple, pay-as-you-go solar lamp service for households without reliable electricity, creating a new market and challenging kerosene suppliers.", "q": "What makes this a disruptive innovation?", "opts": ["It offers a simpler, cheaper, more accessible solution to unmet needs and creates a new market", "It is purely an idea with no users yet", "It only adds a small feature to an existing lamp", "It succeeds only because it is technologically the most advanced lamp"], "expl": "Disruptive innovation transforms markets with simpler, cheaper or more accessible solutions, challenges incumbents and focuses on unmet customer needs.", "type": "mcq", "id": 25, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "Team P only imagines a bus that reroutes by demand. Team Q builds the first working device of an entirely new type. Team R's ride-pooling service is used by thousands.", "q": "How should P, Q and R be classified?", "opts": ["P creativity; Q invention; R innovation", "P invention; Q creativity; R innovation", "P innovation; Q invention; R creativity", "P creativity; Q innovation; R invention"], "expl": "Idea = creativity; new thing = invention; value delivered = innovation.", "theory": true, "type": "mcq", "id": 26, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Creativity, Invention & Innovation", "case": "", "q": "Which pair gives an incremental invention and a disruptive innovation, respectively?", "opts": ["A phone with a larger battery; an online marketplace letting small farmers sell directly to buyers and bypass middlemen", "A phone with a larger battery; a phone with a slightly better camera", "An online marketplace letting small farmers sell directly; a phone with a larger battery", "A marketplace bypassing middlemen; a new payment model replacing cash"], "expl": "Incremental = small improvements to an existing product. Disruptive = new model with simpler, cheaper or more accessible solutions that serves unmet needs.", "theory": true, "type": "mcq", "id": 27, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Kinds of Problems", "case": "Consider three tasks: (a) compute the maximum bending stress in a beam under given loads; (b) design a mobile app that improves student well-being on a campus; (c) reduce air pollution across a metropolitan region where industry, commuters, farmers and regulators have conflicting interests.", "q": "How should the problems be classified?", "opts": ["(a) well-defined; (b) ill-defined; (c) wicked", "(a) ill-defined; (b) wicked; (c) well-defined", "(a) wicked; (b) ill-defined; (c) well-defined", "(a) well-defined; (b) wicked; (c) ill-defined"], "expl": "Well-defined: clear goals and one correct answer. Ill-defined: unclear goals or paths, many solutions (app design). Wicked: complex and interconnected, answers are better or worse, not right or wrong (climate, poverty, healthcare).", "type": "mcq", "id": 28, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Kinds of Problems", "case": "", "q": "Which is a feature of wicked problems?", "opts": ["They are complex and interconnected, and solutions are better or worse rather than right or wrong", "They have one correct answer", "They are solved by applying a standard formula", "They have clear goals and constraints"], "expl": "Examples: climate, poverty, healthcare.", "type": "mcq", "id": 29, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Kinds of Problems", "case": "", "q": "Why does the course say Design Thinking exists?", "opts": ["Well-defined problems cannot be solved by engineers", "Engineering education is useless for all kinds of problems", "Ill-defined and wicked problems do not yield to the methods that work on well-defined ones", "Because linear pipelines are always faster"], "expl": "Traditional engineering education trains you superbly on well-defined problems; the other two kinds need iterative, human-centred methods.", "type": "mcq", "id": 30, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Kinds of Problems", "case": "", "q": "Which statement is correct?", "opts": ["Engineering training is best suited to wicked problems", "Ill-defined problems have clear goals and constraints", "Engineering training suits well-defined problems; ill-defined and wicked problems do not yield to the same methods, hence Design Thinking", "Wicked problems have one correct answer; well-defined ones are better or worse"], "expl": "Well-defined: one correct answer. Ill-defined: many solutions. Wicked: complex, interconnected, better or worse.", "theory": true, "type": "mcq", "id": 31, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "Two groups are given the same unfamiliar layout puzzle. Group X spends most of its time analysing the rules before attempting any arrangement. Group Y quickly tries many arrangements, learns from what fails, and refines.", "q": "In line with Lawson's experiment, which description is correct?", "opts": ["X behaves like scientists (problem-focused); Y behaves like designers (solution-focused)", "X behaves like designers (solution-focused); Y behaves like scientists (problem-focused)", "Both are solution-focused because both aim to finish the puzzle", "X is solution-focused and Y is problem-focused because Y analysed its failures"], "expl": "Lawson's key insight: scientists analyse thoroughly before proposing solutions; designers create and test many solutions rapidly, learning through iteration.", "type": "mcq", "id": 32, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "A start-up's smart lunchbox is loved by test users, and engineers confirm it can be manufactured. But the cost of making and shipping each unit is higher than the selling price, with no route to profit.", "q": "Which IDEO lens is failing, and what does that imply?", "opts": ["Feasibility; the product cannot be built", "Desirability; users do not want the product", "Viability; meeting only two of the three lenses produces a concept that fails in practice", "None; strong desirability alone guarantees innovation"], "expl": "IDEO's three overlapping lenses: desirability (do people want it?), feasibility (can we build it?), viability (is it economically sustainable?). Genuine innovation lies where all three overlap.", "type": "mcq", "id": 33, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "A company builds an internal HR portal using Plan → Build → Test → Ship over fourteen months. In launch week, employees say the navigation does not match how they work, and fixing it requires redoing large parts of the build.", "q": "Which characteristic of this process most directly caused the costly rework?", "opts": ["User feedback arrives only at the end of a linear sequence, so changes are costly", "The team iterated with users too often", "The team spent too long on empathy and prototyping", "The team followed the Stanford d.school loop too strictly"], "expl": "Traditional waterfall is linear, each phase finished before the next, with user feedback at the end. Human-centred design is iterative, with empathy, feedback, prototyping and refinement throughout (CO1).", "type": "mcq", "id": 34, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "Residents of a hostel complain about laundry. A team makes a cardboard-and-paper mock-up of a token-based drop-off counter and asks residents to pretend to use it while the team notes where they get confused.", "q": "Which two Stanford d.school stages is the team performing?", "opts": ["Empathize and Define", "Define and Ideate", "Ideate and Prototype", "Prototype and Test"], "expl": "Building a simple model is Prototype; evaluating it with users is Test. The results then feed back into earlier stages: the process is iterative, not linear.", "type": "mcq", "id": 35, "ans": 3}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "Who is credited in the notes with coining the term 'wicked problems' in the mid-1960s?", "opts": ["Herbert Simon", "Rowe", "Nigel Cross", "Rittel"], "expl": "Mid-1960s: design methods movement, Rittel coins 'wicked problems'. Simon (1969–70s) framed design as a way of thinking.", "type": "mcq", "id": 36, "ans": 3}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "Which pairing of date and event is correct?", "opts": ["2005: Rittel coins 'wicked problems'; 1991: Simon publishes", "1991: Stanford d.school established; 2005: IDEO founded", "1991: IDEO founded; 2005: Stanford d.school established", "1969–70s: IDEO founded; 1982–87: d.school established"], "expl": "Timeline: mid-1960s design methods, 1969–70s Simon, 1982–87 Cross and Rowe, 1991 IDEO, 2005 d.school, today across industries.", "type": "mcq", "id": 37, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "What is the correct order of the Stanford d.school stages?", "opts": ["Ideate, Define, Empathize, Prototype, Test", "Empathize, Define, Ideate, Prototype, Test", "Empathize, Ideate, Define, Test, Prototype", "Define, Empathize, Ideate, Test, Prototype"], "expl": "Testing feeds back into empathy; the process is iterative, not linear.", "type": "mcq", "id": 38, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "In the IDEO framework, the 'desirability' lens asks:", "opts": ["Can we build this?", "Do people want this?", "Will competitors copy it?", "Is it economically sustainable?"], "expl": "Desirability = do people want it; feasibility = can we build it; viability = is it economically sustainable.", "type": "mcq", "id": 39, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "A team proposes a concept that users love and that would be profitable, but the required technology does not exist yet.", "q": "Which IDEO lens fails?", "opts": ["None of them", "Feasibility", "Desirability", "Viability"], "expl": "Users want it (desirable) and it makes money (viable), but it cannot be built yet (not feasible).", "type": "mcq", "id": 40, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "A government-built app is technically sound and cheap to run, but citizens find its purpose unclear and avoid it.", "q": "Which lens is missing?", "opts": ["Legal compliance", "Viability", "Desirability", "Feasibility"], "expl": "A technical success without user desirability sits outside the overlap of the three lenses.", "type": "mcq", "id": 41, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "The Stanford d.school and IDEO frameworks are best described as:", "opts": ["Identical frameworks with the same stages", "Applicable only to physical products", "Competing methods where you must pick one", "Complementary lenses, not rivals"], "expl": "d.school describes the process stages; IDEO's three lenses test whether the outcome is desirable, feasible and viable.", "type": "mcq", "id": 42, "ans": 3}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "Which chronological sequence is correct?", "opts": ["Simon → Rittel → IDEO → Cross and Rowe → d.school", "d.school → IDEO → Cross and Rowe → Simon → Rittel", "Rittel's 'wicked problems' → Simon on design as thinking → Cross and Rowe → IDEO founded → Stanford d.school", "IDEO founded → Rittel → Simon → d.school → Cross and Rowe"], "expl": "Mid-1960s, 1969–70s, 1982–87, 1991, 2005.", "theory": true, "type": "mcq", "id": 43, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "What does Lawson's experiment imply for an open design brief?", "opts": ["Prototype and test many options early, learning through iteration, instead of waiting for complete analysis", "Choose one solution and defend it", "Analyse the problem fully before attempting any solution", "Avoid testing until requirements are fixed"], "expl": "Scientists are problem-focused; designers are solution-focused and learn through rapid iteration.", "theory": true, "type": "mcq", "id": 44, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "Which option correctly pairs d.school stages with their activities?", "opts": ["Define: understand needs; Prototype: pinpoint the problem; Test: build the model", "Define: pinpoint the core problem; Prototype: build a simple model; Test: evaluate and refine with users", "Define: build a simple model; Prototype: pinpoint the core problem; Test: generate ideas", "Define: generate many ideas; Prototype: evaluate with users; Test: build a simple model"], "expl": "Empathize: understand needs; Define: pinpoint the core problem; Ideate: generate ideas; Prototype: build a simple model; Test: evaluate and refine with users; then loop back.", "theory": true, "type": "mcq", "id": 45, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "A company launches a premium smart helmet with advanced sensors at ₹18,000, aimed at two-wheeler riders in small towns. Sales are very low.", "q": "Which analysis best fits the IDEO lenses?", "opts": ["No lens can be applied to hardware products", "Sales are low only because of weak advertising, so run a bigger campaign", "Likely desirability and viability problems (unclear value for the price, low volume); collect evidence through rider interviews, willingness-to-pay tests and cheaper prototype trials", "It must be only a feasibility problem, since sensors fail"], "expl": "A product outside the overlap of desirability, feasibility and viability fails in practice. Watch what riders do, not only what they say.", "theory": true, "type": "mcq", "id": 46, "ans": 2}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking: History & Frameworks", "case": "", "q": "Which statement correctly compares waterfall and human-centred design?", "opts": ["Waterfall is iterative with continuous feedback; HCD is linear with feedback at the end", "Waterfall is linear with feedback at the end; HCD is iterative with continuous feedback", "Both collect user feedback only at the end", "HCD completes each phase fully before moving on"], "expl": "This distinction is CO1: iterative workflows vs linear engineering pipelines.", "theory": true, "type": "mcq", "id": 47, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking Mindset", "case": "", "q": "Which is NOT one of the 'three beliefs' of Design Thinking?", "opts": ["Failure early is cheaper than failure late", "The best idea is the one proposed by the most senior person", "Problems are best understood from the user's side", "Ideas improve by being tested, not by being argued"], "expl": "The three beliefs are the user's side, testing over arguing, and failing early.", "type": "mcq", "id": 48, "ans": 1}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking Mindset", "case": "A start-up tests a paper mock-up with five users in the first week and discovers a fatal navigation flaw, instead of finding it after six months of coding.", "q": "Which DT belief does this illustrate?", "opts": ["Failure early is cheaper than failure late", "Incremental invention beats disruption", "Creativity always needs a large budget", "Problems are best understood from the user's side"], "expl": "Early, cheap prototypes expose flaws before expensive commitment.", "type": "mcq", "id": 49, "ans": 0}, {"unit": "Unit 1 — Foundations of Learning, Creativity & Design Thinking", "topic": "Design Thinking Mindset", "case": "", "q": "Which set lists the skills Unit 1 aims to develop?", "opts": ["Metacognition, self-awareness, creative confidence, critical thinking", "Persona building, interviewing, synthesis", "Prototyping, usability testing, deployment", "SCAMPER, brainstorming, prioritisation"], "expl": "The unit overview lists these skills; interviewing and personas belong to Unit 2, ideation tools to Unit 3.", "type": "mcq", "id": 50, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "Night-shift students at a hostel struggle to find food after 10 pm. Three staff respond. P: 'Poor students, they must be so exhausted.' Q: 'I waited at the gate for two nights and saw the canteen shutter closes at 9:45 while the exam block stays open till midnight.' R: 'So starting this week we are extending canteen hours to 11:30 pm.'", "q": "Which labels fit P, Q and R?", "opts": ["P sympathy; Q empathy; R compassion", "P empathy; Q sympathy; R compassion", "P compassion; Q empathy; R sympathy", "P sympathy; Q compassion; R empathy"], "expl": "Sympathy = feeling for someone from a distance. Empathy = understanding the situation as they experience it. Compassion = empathy plus the decision to act.", "type": "mcq", "id": 51, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "Final-year computer-science students design a revision app for rural Class-10 pupils. Their lead says, 'We were students too, so we already know what students need,' and skips user conversations.", "q": "What is the main flaw, and the best corrective discipline?", "opts": ["They are too young; they should hire older designers", "They should skip qualitative work and run only a large survey", "They should build the app immediately, because prototypes replace conversations", "Their own experience becomes the whole sample; treat it as one hypothesis and check it with several people who are not them"], "expl": "'You are not the user.' Assuming you know what users want because you might be one yourself is the most common mistake. The discipline: 'I think I know. Let me check with six people who are not me.'", "type": "mcq", "id": 52, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "A bank's chatbot replies 'I'm so sorry to hear that' to every complaint, using the same sentence whether a customer reports a failed ₹50 transfer or a frozen salary account, and never adapts its next step to the person's situation.", "q": "Which assessment is best?", "opts": ["It imitates empathetic wording but lacks computational empathy, which needs systems that understand and respond to a person's behaviour and emotions", "It is a good example of computational empathy because it expresses feeling", "It demonstrates the say–do gap", "It shows compassion because it takes action for the customer"], "expl": "Computational empathy applies empathy to software: systems that understand and respond to human emotions and behaviour, often using AI. A fixed script that ignores context does not do that.", "type": "mcq", "id": 53, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "", "q": "In Design Thinking, empathy means:", "opts": ["Assuming users want what the designer would want", "Agreeing to every request users make", "Feeling pity for users from a distance", "Understanding users' feelings, experiences, motivations, frustrations and goals from their point of view"], "expl": "Pity from a distance is sympathy; empathy reveals hidden needs so we solve actual rather than assumed problems.", "type": "mcq", "id": 54, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "", "q": "The 'empathy habit' consists of:", "opts": ["See, feel and listen", "Define, ideate and prototype", "Ask, build and test", "Read, write and reflect"], "expl": "See the world through their eyes, feel their emotions and pain points, listen to their experiences and stories.", "type": "mcq", "id": 55, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "", "q": "Which is the best example of computational empathy?", "opts": ["A printed user manual", "A static FAQ page", "A form with mandatory fields", "A learning app that adapts difficulty to the learner's performance"], "expl": "Computational empathy: systems that understand and respond to human emotions and behaviour, often using AI (e.g., adaptive learning).", "type": "mcq", "id": 56, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "", "q": "Which option correctly differentiates sympathy, empathy and compassion?", "opts": ["Sympathy: feeling for someone from a distance; empathy: understanding as they experience it; compassion: empathy plus the decision to act", "All three mean feeling sorry for someone", "Sympathy: acting for them; empathy: pity; compassion: understanding", "Sympathy: understanding as they experience it; empathy: feeling for from a distance; compassion: pity"], "expl": "Pity produces charity; empathy produces design; compassion produces change.", "theory": true, "type": "mcq", "id": 57, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "A designer says, 'I'm a student too, so I know what students need.'", "q": "What is the disciplined response?", "opts": ["Treat the belief as one hypothesis and check it with several people who are not you", "Build the prototype first and ask later", "Trust it, since lived experience is enough", "Survey 1,000 students and skip conversations"], "expl": "'You are not the user.' Your experience becomes the whole sample unless you check.", "theory": true, "type": "mcq", "id": 58, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Empathy & Computational Empathy", "case": "", "q": "Which statement best discusses whether machines can have empathy?", "opts": ["Computational empathy is meaningless for design", "Machines definitely feel emotions, so no debate is needed", "Systems can detect patterns and respond in context-aware ways (simulation); whether they feel is debatable, so usefulness is judged by accuracy, context and helpfulness", "Only voice assistants can show empathy"], "expl": "Computational empathy: systems that understand and respond to human emotions and behaviour, often with AI.", "theory": true, "type": "mcq", "id": 59, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "User Research Methods", "case": "An e-commerce firm sees that most mobile users leave at the payment page. The team wants to understand why, and then to know how widespread each reason is.", "q": "Which research plan best matches the course?", "opts": ["Interview and observe a few users to discover reasons, then validate the strongest ones at scale with a survey or analytics", "Interview 500 users and treat the percentages as the whole finding", "Run A/B tests on button colours only; reasons are unnecessary", "Run a large survey first, then interview users"], "expl": "Use qualitative research to discover insights, then quantitative research to validate them at scale. They are partners, not rivals.", "type": "mcq", "id": 60, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "User Research Methods", "case": "A: eight interviews to learn why commuters skip a feeder bus. B: an A/B test of two ticket-button designs across 20,000 sessions. C: observing ten shoppers inside a pharmacy.", "q": "How should A, B and C be classified?", "opts": ["A quantitative; B qualitative; C quantitative", "A qualitative; B quantitative; C qualitative", "A qualitative; B qualitative; C quantitative", "A quantitative; B quantitative; C qualitative"], "expl": "Qualitative: understanding why and how (interviews, observation; small samples of about 5–20). Quantitative: measuring what and how many (surveys, analytics, A/B tests; large samples).", "type": "mcq", "id": 61, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "User Research Methods", "case": "", "q": "Typical sample sizes for the two research approaches are:", "opts": ["Qualitative: 100+; quantitative: about 5–20", "Qualitative: about 5–20 participants; quantitative: 100+", "Both: 100+", "Both: fewer than 10"], "expl": "Qualitative explores why and how in depth; quantitative measures what and how many at scale.", "type": "mcq", "id": 62, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "User Research Methods", "case": "A team wants to know whether a new checkout layout raises completion rates across thousands of sessions.", "q": "Which method fits best?", "opts": ["A small focus group (qualitative)", "An A/B test (quantitative)", "Observing five users at home", "Building an empathy map"], "expl": "A/B tests, surveys and analytics validate hypotheses at scale.", "type": "mcq", "id": 63, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "User Research Methods", "case": "", "q": "Which option correctly compares qualitative and quantitative research?", "opts": ["Qualitative: why/how, interviews, small samples, exploring; quantitative: what/how many, surveys or A/B tests, large samples, validating", "Qualitative: what/how many, surveys, large samples; quantitative: why/how, interviews, small samples", "Qualitative: A/B tests, large samples; quantitative: interviews", "Both measure how many with large samples"], "expl": "Use qualitative research to discover, then quantitative to validate; they are partners.", "theory": true, "type": "mcq", "id": 64, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "Notes from a railway ticket counter: (1) 14 people queue to buy tickets; (2) glare on the kiosk screens in afternoon sun; (3) three passengers ask staff for help with the touchscreen; (4) most carry cash and a phone.", "q": "Which mapping to AEIOU is correct?", "opts": ["1 Interactions; 2 Objects; 3 Activities; 4 Users", "1 Activities; 2 Objects; 3 Environment; 4 Interactions", "1 Users; 2 Environment; 3 Objects; 4 Activities", "1 Activities; 2 Environment; 3 Interactions; 4 Objects"], "expl": "A = Activities (what people do), E = Environment (where they do it, e.g., lighting), I = Interactions (how they engage with people or systems), O = Objects (what they use), U = Users (who they are).", "type": "mcq", "id": 65, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "Four team members submit notes from a visit to a bank branch.", "q": "Which note is a genuine observation rather than a judgement?", "opts": ["'Customers are impatient.'", "'The deposit slip design is confusing.'", "'Six of fifteen customers asked the same question about how to fill the deposit slip.'", "'The counter staff are rude.'"], "expl": "Observations are factual, countable behaviour. 'Rude', 'impatient' and 'confusing' are judgements or inferences. Observe and record first; understand later.", "type": "mcq", "id": 66, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "A team plans to study how students struggle with hostel Wi-Fi. They propose photographing students in the common room, interviewing people in their hostel rooms, and writing each person's full name in the notes.", "q": "Which revised plan best follows the ethics and consent guidance?", "opts": ["Photograph people but blur faces later, and interview in hostel rooms once the warden agrees", "Take one consent from the warden for everyone and record full names to avoid confusion", "Continue as planned, since observing public places means individuals can be studied without agreement", "Observe public areas, read a consent script before interviewing, record initials or pseudonyms, and sketch the scene instead of photographing people"], "expl": "Ask first; say who you are (consent script); stay anonymous; do not photograph people; be safe and avoid residential spaces such as hostel rooms. Informed consent is itself a practice of human-centred design.", "type": "mcq", "id": 67, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "", "q": "In field observation, the designer should:", "opts": ["Stage tasks in a laboratory only", "Observe users in their natural environment without interrupting or influencing behaviour", "Intervene to correct users' mistakes", "Ask leading questions to speed up findings"], "expl": "'Be a fly on the wall': do not interrupt or influence; take notes discreetly. Observe what they actually do, not what they say.", "type": "mcq", "id": 68, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "At a school bus stop, a researcher records shade, noise level and crowding.", "q": "Which AEIOU letter do these notes belong to?", "opts": ["Activities", "Environment", "Users", "Objects"], "expl": "Lighting, noise, temperature, space and technology are key environmental factors.", "type": "mcq", "id": 69, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "", "q": "In AEIOU, which letter answers 'who they are'?", "opts": ["U (Users)", "I (Interactions)", "A (Activities)", "O (Objects)"], "expl": "A = what people do, E = where, I = how they engage, O = what they use, U = who they are.", "type": "mcq", "id": 70, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "", "q": "Which set of statements best matches the verbal consent script?", "opts": ["Offer a reward and record full names", "State who you are and the purpose, say it takes about five minutes, is voluntary, can be stopped or skipped, and no name will be recorded", "Start the interview and ask permission at the end", "Tell participants that taking part is required by the course"], "expl": "Consent must be informed and voluntary; participants can stop or skip any question at any time.", "type": "mcq", "id": 71, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "A pair wants to observe students inside hostel rooms; their faculty mentor cannot be reached.", "q": "What should they do?", "opts": ["Go ahead since they are working in pairs", "Take photographs to keep accurate records", "Go at night when rooms are quiet", "Avoid residential spaces and choose a public area such as a library reading area or corridor; ask the mentor first if in doubt"], "expl": "Suitable sites are public and appropriate; avoid residential spaces such as hostel rooms; if in doubt ask your faculty mentor before you begin.", "type": "mcq", "id": 72, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "At a bus-ticket vending machine you note: (i) users select a destination and insert cash; (ii) glare on the screen and noise; (iii) an elderly commuter asks a stranger for help; (iv) the machine, coins and phones.", "q": "Which AEIOU mapping is correct?", "opts": ["(i) Activities; (ii) Objects; (iii) Environment; (iv) Interactions", "(i) Activities; (ii) Environment; (iii) Interactions; (iv) Objects", "(i) Interactions; (ii) Environment; (iii) Activities; (iv) Users", "(i) Users; (ii) Activities; (iii) Objects; (iv) Environment"], "expl": "A = what people do; E = where; I = how they engage; O = what they use; U = who they are.", "theory": true, "type": "mcq", "id": 73, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "An observer notes: user opens a ticket app and scrolls fares; compares options repeatedly and hesitates at payment; possibly worried about refund rules.", "q": "Which assignment to What–How–Why is correct?", "opts": ["WHAT: hesitates at payment; HOW: worry about refund rules; WHY: opens the app", "WHAT: possibly worried; HOW: scrolls fares; WHY: repeated comparing", "WHAT: worry about refund rules; HOW: opens app; WHY: scrolls fares", "WHAT: opens app and scrolls fares; HOW: repeated comparing and hesitation; WHY (inference to verify): worry about refund rules"], "expl": "Observation without interpretation is data; interpretation without observation is guesswork. Label inference as inference.", "theory": true, "type": "mcq", "id": 74, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Field Observation & Research Ethics", "case": "", "q": "Which set correctly lists the research-ethics principles from the course?", "opts": ["Photograph for accuracy; record full names; ask permission afterwards; work alone", "Ask first; say who you are; stay anonymous; do not photograph people; be safe", "Take consent only from a mentor; record names; meet in private", "Ask first; stay anonymous; but photograph people and meet privately at night"], "expl": "Informed consent is itself a practice of human-centred design.", "theory": true, "type": "mcq", "id": 75, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "A team preparing to interview patients about a pharmacy home-delivery service drafts four possible questions.", "q": "Which is the best interview question?", "opts": ["'Don't you think delivery is too slow?'", "'Is the app easy to use?'", "'Tell me about the last time you ordered medicines — what happened?'", "'Would you pay ₹30 more for faster delivery?'"], "expl": "Good questions are open-ended, non-leading, exploratory and about real experience. The others are leading, hypothetical and closed (yes/no). 'Tell me about the last time…' invites a specific story.", "type": "mcq", "id": 76, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "A student says she skips 8 a.m. lectures. Why? 'I'm too tired.' Why? 'I sleep at 3 a.m.' Why? 'Assignments pile up and I finish them at night.' Why? 'Several faculty release assignments on Thursday evening, all due on Friday.'", "q": "Which design-actionable root cause did the ladder reach, and what does it show?", "opts": ["Tiredness; the team should design a sleep-tracking app", "Student laziness; attendance penalties are the answer", "Early lecture timing; the first Why was the real one", "Uncoordinated assignment release and deadlines across courses; the first answer ('too tired') was only a symptom"], "expl": "The Five Whys peel back layers until you reach a cause you can design for. The first Why is almost never the real one.", "type": "mcq", "id": 77, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "", "q": "A question that cannot be answered yes/no and does not suggest an answer is:", "opts": ["Solution-centred", "Open-ended and non-leading", "Hypothetical", "Closed and leading"], "expl": "Good questions are open-ended, non-leading, exploratory and user-focused, about experiences, not hypotheticals.", "type": "mcq", "id": 78, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "", "q": "The '80/20 rule' for interviewers means:", "opts": ["80% of users reveal 20% of needs", "Talk 80% and listen 20%", "Ask 80 questions in 20 minutes", "Listen about 80% of the time and talk about 20%"], "expl": "Listen more than you talk; do not defend or explain your ideas.", "type": "mcq", "id": 79, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "An interviewer says, 'Walk me through your typical morning, from waking up to reaching class.'", "q": "Which technique is this?", "opts": ["The Five Whys", "Embrace silence", "Seek contradictions", "Grand tour"], "expl": "Grand tour invites a full walk-through of a typical routine.", "type": "mcq", "id": 80, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "", "q": "Which is the best rewrite of the poor question 'Do you like the sports complex?'", "opts": ["'Is the sports complex good or bad?'", "'Don't you think the sports complex is great?'", "'Tell me about your last visit to the sports complex.'", "'Would you visit the sports complex if it were bigger?'"], "expl": "Good questions are open-ended, non-leading, exploratory and about real experience.", "theory": true, "type": "mcq", "id": 81, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Interviews & Five Whys", "case": "Five Whys on 'I rarely use the campus gym': crowded at 6 pm → all classes end at 5:30 → I can't go later because it closes at 8 pm and I have labs → schedule set for staff convenience → I feel I am paying for something I can't use.", "q": "Which is the most design-actionable root cause?", "opts": ["Students are lazy", "The gym is crowded at 6 pm", "Students pay fees", "Opening hours and slot allocation do not match student timetables"], "expl": "The first Why is almost never the real one; keep asking until you reach a cause you can design for.", "theory": true, "type": "mcq", "id": 82, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "In a survey, 85% of students say they want 'healthier options' in the canteen. Over one month, the salad counter accounts for 6% of sales while fried snacks sell out before 1 p.m.", "q": "How should the team interpret this?", "opts": ["Conclude the students lied and discard both sources", "Add more salad counters immediately, since 85% asked for them", "Trust the survey and discard the sales data", "It is a say–do gap: stated preference reflects self-image, observed behaviour reflects need, so investigate why healthier options are not chosen before designing"], "expl": "Ask what people do; watch what people choose. Stated preference is evidence about self-image; observed behaviour is evidence about need.", "type": "mcq", "id": 83, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "Older users of a cab app tell researchers, 'Please make the text bigger.' Observers notice that each time they ask a neighbour to confirm the booking and hesitate before pressing Confirm.", "q": "Which pairing of explicit and (plausible, to be verified) implicit need is best?", "opts": ["Explicit: larger text; implicit: confidence and reassurance that the booking is right", "Both are explicit, because users mentioned them", "Explicit: asking neighbours; implicit: faster internet", "Explicit: reassurance; implicit: larger text"], "expl": "Explicit needs are what users say they want. Implicit needs are what they actually need, often unspoken, and are revealed through observation and analysis (safety, confidence, comfort, trust). Label such inferences as inferences.", "type": "mcq", "id": 84, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "A team studying delivery riders writes four pain-point statements.", "q": "Which is best formed according to the course?", "opts": ["'Riders hate the platform.'", "'Riders probably want better pay.'", "'The platform's support is poor, in our opinion.'", "'7 of 9 riders interviewed waited over 20 minutes, unpaid, at restaurant counters; R4: \"my whole evening goes in waiting.\"'"], "expl": "Every pain point you record needs evidence: a quote or a count. This one is specific and backed by both. The others are opinion or guesswork.", "type": "mcq", "id": 85, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "", "q": "A user says, 'I want faster checkout.' According to the notes, the underlying implicit need is most likely:", "opts": ["Lower cost", "Faster internet", "To feel in control of the process", "Better battery"], "expl": "Explicit needs are what users say; implicit needs (control, safety, trust) are revealed through observation and analysis.", "type": "mcq", "id": 86, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "Customers of an online service report: 'When payment fails, nobody helps us and we cannot reach anyone.'", "q": "Which pain-point category is this?", "opts": ["Financial", "Process", "Productivity", "Support"], "expl": "Support = lack of help or guidance. Process = inefficient procedures; financial = costs too much money or time; productivity = wastes time or effort.", "type": "mcq", "id": 87, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "", "q": "What is the right response to a say–do gap?", "opts": ["Assume users lied and discard the data", "Trust what they say and ignore behaviour", "Ignore both sources", "Ask what people do and watch what they choose; treat stated preference as evidence of self-image and investigate why behaviour differs"], "expl": "Explicit needs are said; implicit needs are revealed through observation.", "theory": true, "type": "mcq", "id": 88, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Needs & Pain Points", "case": "Four pain points: (i) an inefficient, frustrating procedure; (ii) no help available; (iii) costs too much money or time; (iv) wastes time or effort.", "q": "Which matching to pain-point type is correct?", "opts": ["(i) support; (ii) process; (iii) productivity; (iv) financial", "(i) productivity; (ii) financial; (iii) support; (iv) process", "(i) process; (ii) support; (iii) financial; (iv) productivity", "(i) financial; (ii) productivity; (iii) process; (iv) support"], "expl": "Every pain point you record needs evidence: a quote or a count.", "theory": true, "type": "mcq", "id": 89, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Personas & Empathy Maps", "case": "A team's persona reads: 'Anita, 34, nurse, wants a quick way to check shift changes; says, \"I can't keep refreshing the roster.\" Loves yoga, drinks green tea, owns two cats.' Their interview notes support only the first part; nothing mentions yoga, tea or cats.", "q": "What should the team do with the unsupported lines?", "opts": ["Move them to the archetype section", "Keep them to make Anita relatable", "Keep them but present them as direct quotes", "Delete them, because every line in a persona must trace to something a real person said or did"], "expl": "A persona is a research summary, not a character you invented. If you cannot point to the interview it came from, delete it.", "type": "mcq", "id": 90, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Personas & Empathy Maps", "case": "A team notes: 'Our target groups are college students, working professionals and senior citizens.' They then pick one group and write a profile of 'Karthik, 22, final-year student', with goals, frustrations and a real quote.", "q": "What do these two outputs represent?", "opts": ["Both are archetypes", "Both are personas", "The groups are archetypes (they help segment); Karthik is a persona (one individual to empathise with)", "The groups are personas; Karthik is an archetype"], "expl": "Archetypes are broad groups with shared behaviour. A persona makes one of those groups concrete enough to design for.", "type": "mcq", "id": 91, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Personas & Empathy Maps", "case": "An empathy map for a language-learning app records. SAYS: 'I love the app.' THINKS: 'I'll restart on Monday.' DOES: opened the app on 2 of the last 14 days. FEELS: guilty.", "q": "Where is the richest design opportunity?", "opts": ["Only in the FEELS quadrant, since emotion overrides behaviour", "Nowhere; her positive statement means nothing needs to change", "In adding more features, since she says she loves the app", "In the gap between what she says (love) and what she does (rare use)"], "expl": "Where SAYS and DOES disagree is usually your best opportunity. Empathy maps synthesise what users say, think, do and feel.", "type": "mcq", "id": 92, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Personas & Empathy Maps", "case": "", "q": "In an empathy map, 'observable actions and behaviours' belong to which quadrant?", "opts": ["DOES", "THINKS", "SAYS", "FEELS"], "expl": "SAYS = direct quotes; THINKS = beliefs and concerns; DOES = observable actions; FEELS = emotions and attitudes.", "type": "mcq", "id": 93, "ans": 0}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Personas & Empathy Maps", "case": "", "q": "Which statement correctly relates personas and archetypes?", "opts": ["A persona is a broad group; an archetype is one fictional individual", "A persona can include any invented detail that makes it relatable", "An archetype is a broad group with shared behaviour; a persona is one fictional individual built from real research, every line traceable", "Archetypes and personas are identical"], "expl": "A persona is a research summary: if you cannot point to the interview it came from, delete it.", "theory": true, "type": "mcq", "id": 94, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Personas & Empathy Maps", "case": "", "q": "Which option correctly describes the empathy-map quadrants?", "opts": ["SAYS: beliefs; THINKS: actions; DOES: emotions; FEELS: quotes", "SAYS: direct quotes; THINKS: beliefs and concerns; DOES: observable actions; FEELS: emotions and attitudes", "SAYS: observable actions; THINKS: emotions; DOES: direct quotes; FEELS: beliefs", "SAYS: emotions; THINKS: direct quotes; DOES: beliefs; FEELS: actions"], "expl": "Where SAYS and DOES disagree is usually your best opportunity.", "theory": true, "type": "mcq", "id": 95, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Problem Framing", "case": "A team drafts four problem statements about a hospital canteen, using the format [User] needs [need] because [insight].", "q": "Which is the best problem statement?", "opts": ["'Nurses need a better canteen because they are unhappy.'", "'Night-shift nurses need a way to eat a warm meal within their 30-minute break because queueing and billing at the canteen take 20 minutes.'", "'Build a self-checkout kiosk for the hospital canteen.'", "'We need a canteen app.'"], "expl": "A good statement names a user, a need and an insight, and inspires solutions without naming one. 'We need an app' and 'build a kiosk' bake the solution in.", "type": "mcq", "id": 96, "ans": 1}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Problem Framing", "case": "A team working on confusion in a hospital's out-patient department (OPD) drafts four candidate questions.", "q": "Which passes the Goldilocks test for a How Might We question?", "opts": ["'How might we improve healthcare?'", "'Why do patients not read the signs?'", "'How might we help first-time patients feel confident about where to go in the OPD?'", "'How might we add a QR code to the OPD token slip?'"], "expl": "Too broad gives nothing usable; too narrow smuggles in the solution. Aim for the middle: a real human need with no solution attached, and framed as an opportunity.", "type": "mcq", "id": 97, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Problem Framing", "case": "", "q": "Why is 'We need a smart dustbin app' a poor problem statement?", "opts": ["It is too long", "It follows the [User] needs [need] because [insight] format", "It has no user, need or insight, and the solution is already baked in", "It names the user but not the solution"], "expl": "A good statement frames the challenge clearly and inspires solutions without naming one.", "type": "mcq", "id": 98, "ans": 2}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Problem Framing", "case": "Elderly commuters at a metro station struggle with ticket machines.", "q": "Which problem statement and HMW pair is best?", "opts": ["Statement: 'Build a voice-controlled kiosk.' HMW: 'How might we make a kiosk?'", "Statement: 'We need bigger ticket machines.' HMW: 'How might we improve public transport?'", "Statement: 'Elderly commuters are slow.' HMW: 'How might we add a larger Confirm button?'", "Statement: 'Elderly commuters need to buy a ticket without help because small text and many steps make them anxious about holding up the queue.' HMW: 'How might we help elderly commuters feel confident buying a ticket on their own?'"], "expl": "A good statement names user, need and insight without a solution. A good HMW passes the Goldilocks test: not too broad, not too narrow.", "theory": true, "type": "mcq", "id": 99, "ans": 3}, {"unit": "Unit 2 — Empathy, Observation & Problem Identification", "topic": "Problem Framing", "case": "A team wants to design a digital-payment solution for street vendors.", "q": "Which plan best applies the Unit 2 pipeline?", "opts": ["AEIOU scan and consent-based open interviews, a Five Whys ladder, separate explicit and implicit needs, build a traceable persona and empathy map, then write a problem statement and HMW", "Design the app first, then survey vendors", "Ask vendors whether they would use a payment app and build features from yes answers", "Photograph vendors and record full names, then run only a quantitative survey"], "expl": "Observe, interview, dig, separate, build, frame, with ethical safeguards throughout.", "theory": true, "type": "mcq", "id": 100, "ans": 0}, {"unit": "Unit 3 — Ideation & Creative Problem Solving", "topic": "Ideation & Creative Problem Solving", "case": "A city engineer receives many complaints about potholes and immediately starts comparing bids from road contractors, without checking where, when and why the damage keeps recurring.", "q": "Which CPS stage was rushed, and what does it risk?", "opts": ["Develop; the ideas were scored too carefully", "Implement; the solution was launched too slowly", "Ideate; too many ideas were generated", "Clarify; the team may solve the assumed problem rather than the real one"], "expl": "Clarify means identifying the real problem before searching for solutions: understanding needs, collecting facts and asking 'Why?' to reach the root cause.", "type": "mcq", "id": 101, "ans": 3}, {"unit": "Unit 3 — Ideation & Creative Problem Solving", "topic": "Ideation & Creative Problem Solving", "case": "A team (i) interviews residents and runs a Five Whys on water shortage, (ii) lists forty possible solutions, (iii) scores them on cost and feasibility and improves the best two, and (iv) pilots one in two neighbourhoods.", "q": "Which sequence of CPS stages does this describe?", "opts": ["Develop → Ideate → Clarify → Implement", "Clarify → Develop → Ideate → Implement", "Ideate → Clarify → Implement → Develop", "Clarify → Ideate → Develop → Implement"], "expl": "Clarify (understand the real problem), Ideate (generate many solutions), Develop (evaluate and improve), Implement (apply the best solution). Open, open, close, close.", "type": "mcq", "id": 102, "ans": 3}, {"unit": "Unit 3 — Ideation & Creative Problem Solving", "topic": "Ideation & Creative Problem Solving", "case": "", "q": "Ideation emphasises:", "opts": ["Choosing the first workable idea", "Evaluating each idea while generating it", "Quantity of ideas before quality, without judging", "Quality before quantity"], "expl": "Great solutions begin with generating many ideas, not by choosing the first idea.", "type": "mcq", "id": 103, "ans": 2}, {"unit": "Unit 3 — Ideation & Creative Problem Solving", "topic": "Ideation & Creative Problem Solving", "case": "", "q": "Which CPS stage has the main question 'Which solution works best?'", "opts": ["Ideate", "Develop", "Implement", "Clarify"], "expl": "Clarify: what is the real problem? Ideate: what are the possible solutions? Develop: which works best? Implement: how do we make it work in practice?", "type": "mcq", "id": 104, "ans": 1}, {"unit": "Unit 3 — Ideation & Creative Problem Solving", "topic": "Ideation & Creative Problem Solving", "case": "", "q": "Which option best describes ideation?", "opts": ["Working alone to produce one polished concept", "Selecting a single best idea early", "Evaluating each idea as it appears", "Generating and exploring many creative ideas, deferring judgment, quantity before quality, collaboratively"], "expl": "Ideation promotes creativity, multiple alternatives, collaboration and reduced design risk.", "theory": true, "type": "mcq", "id": 105, "ans": 3}, {"unit": "Unit 3 — Ideation & Creative Problem Solving", "topic": "Ideation & Creative Problem Solving", "case": "", "q": "Which matching of CPS stage to its main question is correct?", "opts": ["Clarify: what is the real problem? Ideate: what are the possible solutions? Develop: which works best? Implement: how do we make it work?", "Clarify: what are the possible solutions? Ideate: which works best? Develop: what is the real problem? Implement: how do we make it work?", "Clarify: how do we make it work? Ideate: which works best? Develop: what are the possible solutions? Implement: what is the real problem?", "Clarify: which works best? Ideate: what is the real problem? Develop: how do we make it work? Implement: what are the possible solutions?"], "expl": "Open (Clarify, Ideate), then close (Develop, Implement).", "theory": true, "type": "mcq", "id": 106, "ans": 0}, {"unit": "Unit 3 — Ideation & Creative Problem Solving", "topic": "Divergent & Convergent Thinking", "case": "In a 20-minute session to find ways to reduce irrigation water use, one participant says 'too expensive' after every idea. The group produces only six ideas.", "q": "What principle is violated, and what is the likely effect?", "opts": ["Divergent thinking was overused; the group should have converged earlier", "Judgement was mixed into generation; deferring judgement is essential because early evaluation kills promising ideas", "Convergent thinking was skipped, so no decision was possible", "Constraint framing was applied too early and increased the idea count"], "expl": "Never mix the two phases. When generating, defer all judgment; evaluate only after ideation is complete.", "type": "mcq", "id": 107, "ans": 1}, {"unit": "Unit 3 — Ideation & Creative Problem Solving", "topic": "Divergent & Convergent Thinking", "case": "A team generated 60 ideas on Monday. By Friday they are still adding ideas and have not shortlisted any.", "q": "What do the course notes say about this situation?", "opts": ["They should mix evaluation into every new idea to go faster", "They converged too early", "They are diverging too long; the two modes should alternate, and they must now converge by evaluating and selecting", "They are doing it right, because more ideas always improve outcomes"], "expl": "Divergent and convergent thinking are alternating phases, not rivals. Trouble starts when you converge too early (killing good ideas) or diverge too long (never deciding).", "type": "mcq", "id": 108, "ans": 2}, {"unit": "Unit 3 — Ideation & Creative Problem Solving", "topic": "Divergent & Convergent Thinking", "case": "", "q": "Convergent thinking is best characterised as:", "opts": ["Expanding the number
